[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-monitor-v3"
version = "0.1.0"
description = "Uptime Monitor V3 — hexagonal backend (four-zone architecture)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = ["pytest", "import-linter"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
