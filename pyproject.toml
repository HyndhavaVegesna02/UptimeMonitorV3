[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-monitor-v3"
version = "0.1.0"
description = "Uptime Monitor V3 — hexagonal backend (four-zone architecture)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "python-dotenv",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest", "import-linter", "ruff", "uvicorn[standard]", "cfn-lint"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

# Import-linter contracts (dossier §4) — the architecture's non-LLM boundary floor.
# Run via the MODULE form, not the `lint-imports` exe shim, which a Windows
# Application Control policy has blocked since 2026-07-12:
#   python -c "from importlinter.cli import lint_imports_command; lint_imports_command()"
# root_package `src` lives at backend/src (exposed by package-dir above); the
# editable install makes it importable. NOTE that the editable install is a plain
# absolute sys.path entry, so `src.*` resolves to the MAIN tree even when this
# runs from a worktree or a scratch copy — force PYTHONPATH=<tree>/backend when a
# check must analyse anything other than the main tree, or the result is silently
# about the wrong code.
[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core-independence"
type = "forbidden"
source_modules = ["src.core"]
forbidden_modules = ["src.adapters", "src.composition", "src.api", "sqlalchemy", "httpx", "boto3"]

[[tool.importlinter.contracts]]
name = "core-internal-layering"
type = "layers"
layers = ["src.core.queries", "src.core.services", "src.core.ports", "src.core.domain"]

# Dossier §4 names vendor subpackages (inbound.dynatrace, outbound.statuspage,
# persistence) — all three exist today (STORY-001 scaffolded them; STORY-087
# migrated persistence to DynamoDB). The real modules are used here so the
# contract runs green against real code, not phantoms.
[[tool.importlinter.contracts]]
name = "adapters-independence"
type = "independence"
modules = ["src.adapters.inbound", "src.adapters.outbound", "src.adapters.persistence"]

[[tool.importlinter.contracts]]
name = "api-feature-independence"
type = "independence"
modules = [
    "src.api.v1.decisions",
    "src.api.v1.health",
    "src.api.v1.components",
    "src.api.v1.approvals",
    "src.api.v1.maintenance",
    "src.api.v1.availability",
    "src.api.v1.history",
    "src.api.v1.publications",
    "src.api.v1.topology",
    # STORY-048 sample-mode seam (temporary — see docs/scrum/wiki/sample-mode.md)
    "src.api.v1.sample_mode",
]

# The api zone's thinness becomes a build failure (closes G1)
[[tool.importlinter.contracts]]
name = "api-outward-independence"
type = "forbidden"
source_modules = ["src.api"]
forbidden_modules = ["src.adapters", "src.composition", "sqlalchemy", "psycopg", "httpx", "boto3"]

# Adapters are edge-only: they implement ports, they never reach up
[[tool.importlinter.contracts]]
name = "adapters-edge-only"
type = "forbidden"
source_modules = ["src.adapters"]
forbidden_modules = ["src.api", "src.composition"]

# Shared edge infra can never reach into a feature
[[tool.importlinter.contracts]]
name = "api-shared-no-feature-imports"
type = "forbidden"
source_modules = ["src.api.v1._shared"]
forbidden_modules = [
    "src.api.v1.decisions", "src.api.v1.health", "src.api.v1.components",
    "src.api.v1.approvals", "src.api.v1.maintenance", "src.api.v1.availability",
    "src.api.v1.history", "src.api.v1.publications", "src.api.v1.topology",
    "src.api.v1.sample_mode",
]

[[tool.importlinter.contracts]]
name = "src-no-tests"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["tests"]

# ZR-1 (docs/scrum/wiki/zone-rules.md): an inbound adapter is a pure translation
# function — it returns canonical values and persists nothing. This forbids the
# PERSISTENCE/REPOSITORY ports specifically, not the whole `src.core.ports` package:
# `src.core.ports.signal_ingest` is the core's documented FRONT DOOR (dossier §6/§8,
# a driving adapter may legitimately reference it) and `src.core.ports.clock` /
# `src.core.ports.status_publisher` are not persistence, so banning the whole
# package would forbid a shape the design documents as legitimate (STORY-206).
#
# `backend/src/core/ports/__init__.py` re-exports every port, including all
# nine forbidden ones, and import-linter follows INDIRECT chains by default —
# so an inbound adapter MUST import a port by its EXACT module, e.g.
# `from src.core.ports.signal_ingest import SignalIngestPort`, never the
# package form `from src.core.ports import SignalIngestPort` (that form
# trips this contract on all nine forbidden modules at once, even for the
# front door, because it transitively imports the whole package — verified
# by mutation, STORY-206 rework).
[[tool.importlinter.contracts]]
name = "inbound-adapters-dont-persist"
type = "forbidden"
source_modules = ["src.adapters.inbound"]
forbidden_modules = [
    "src.core.ports.component_repository",
    "src.core.ports.maintenance_repository",
    "src.core.ports.observation_repository",
    "src.core.ports.proposal_repository",
    "src.core.ports.publication_repository",
    "src.core.ports.rejected_observation_repository",
    "src.core.ports.sample_mode_repository",
    "src.core.ports.signal_repository",
    "src.core.ports.watermark",
]
# Maintenance note (STORY-197; this contract landed by STORY-206): a newly
# added repository/persistence port module MUST be appended to this list in
# the SAME commit that adds it, or it is invisible to this guard.
# `src.core.ports.signal_ingest` (the front door) and
# `src.core.ports.clock`/`status_publisher` (not persistence) are
# deliberately excluded — see the comment block above the contract.


[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [".agents", ".venv", "frontend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
