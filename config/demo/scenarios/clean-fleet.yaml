# STORY-176 AC5(a) — a clean fleet across all locations.
# Every declared cycle reports UP from all four demo locations
# (config/demo/fleet-core.yaml's api-gateway-health monitor).
api-gateway-health:
  monitor_id: HTTP_CHECK-DEMO-APIGW-HEALTH
  interval_seconds: 30
  cycles:
    - [SYNTHETIC_LOCATION-DEMOA, SYNTHETIC_LOCATION-DEMOB, SYNTHETIC_LOCATION-DEMOC, SYNTHETIC_LOCATION-DEMOD]
    - [SYNTHETIC_LOCATION-DEMOA, SYNTHETIC_LOCATION-DEMOB, SYNTHETIC_LOCATION-DEMOC, SYNTHETIC_LOCATION-DEMOD]
    - [SYNTHETIC_LOCATION-DEMOA, SYNTHETIC_LOCATION-DEMOB, SYNTHETIC_LOCATION-DEMOC, SYNTHETIC_LOCATION-DEMOD]
    - [SYNTHETIC_LOCATION-DEMOA, SYNTHETIC_LOCATION-DEMOB, SYNTHETIC_LOCATION-DEMOC, SYNTHETIC_LOCATION-DEMOD]
    - [SYNTHETIC_LOCATION-DEMOA, SYNTHETIC_LOCATION-DEMOB, SYNTHETIC_LOCATION-DEMOC, SYNTHETIC_LOCATION-DEMOD]
