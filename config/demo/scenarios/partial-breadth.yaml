# STORY-191 — partial-breadth case (down at DEMOA, up at DEMOB, DEMOC, DEMOD)
auth-service-login:
  monitor_id: HTTP_CHECK-DEMO-AUTH-LOGIN
  interval_seconds: 30
  cycles:
    - { SYNTHETIC_LOCATION-DEMOA: down, SYNTHETIC_LOCATION-DEMOB: up, SYNTHETIC_LOCATION-DEMOC: up, SYNTHETIC_LOCATION-DEMOD: up }
    - { SYNTHETIC_LOCATION-DEMOA: down, SYNTHETIC_LOCATION-DEMOB: up, SYNTHETIC_LOCATION-DEMOC: up, SYNTHETIC_LOCATION-DEMOD: up }
    - { SYNTHETIC_LOCATION-DEMOA: down, SYNTHETIC_LOCATION-DEMOB: up, SYNTHETIC_LOCATION-DEMOC: up, SYNTHETIC_LOCATION-DEMOD: up }
