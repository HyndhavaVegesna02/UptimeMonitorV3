<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uptime Monitor</title>
    <script>
      // Resolve the theme before first paint so there is no flash of the
      // wrong theme. Mirrors src/theme/resolveTheme.ts (kept inline and
      // dependency-free because it must run before any module loads).
      // Precedence corrected at the STORY-103 reality gate (2026-07-18):
      // stored choice > dark, PERIOD — the OS/browser
      // `prefers-color-scheme` is NEVER consulted. Most headless/desktop
      // systems report `light` by default, which would make the common
      // first impression light and defeat Mission Teal's dark-first
      // mission-control identity; only the user's own explicit toggle
      // (persisted) can ever move the app to light.
      (function () {
        try {
          var stored = localStorage.getItem('uptime-monitor-theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
