<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uptime Monitor</title>
    <script>
      // Resolve the theme before first paint so there is no flash of the
      // wrong theme. Mirrors src/theme/resolveTheme.ts (kept inline and
      // dependency-free because it must run before any module loads).
      // Mission Teal is dark-first (STORY-103): a stored override wins;
      // else an EXPLICIT system preference (dark or light); else dark —
      // never "no preference detected -> light".
      (function () {
        try {
          var stored = localStorage.getItem('uptime-monitor-theme');
          var theme;
          if (stored === 'dark' || stored === 'light') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          } else {
            theme = 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
