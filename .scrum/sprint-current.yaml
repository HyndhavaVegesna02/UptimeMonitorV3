retro_candidates:
  - id: RC-1
    raised: 2026-08-04 (STORY-205)
    severity: real, caught by luck rather than by design
    title: >-
      CONCURRENT REVIEWERS RACE ON THE WORKING TREE -- the quality reviewer MUTATES source to probe,
      and the spec reviewer restored its mutation mid-flight.
    what_happened: >-
      The skill mandates the two reviews run CONCURRENTLY because they are independent judgements.
      But yt-quality-reviewer is told it may mutate to probe (restoring afterwards), while
      yt-spec-reviewer is read-only and treats a dirty tree as something to clean. On STORY-205 the
      spec reviewer opened its session, found topology_keys.py locally modified
      (`_COMPONENT_SK_PREFIX = "COMPONENTX#"` -- the quality reviewer's live probe), correctly
      judged it was outside the reviewed diff, and ran `git checkout --` on it. It then REPORTED the
      stray mutation to the orchestrator, which is the only reason this was noticed at all.
    why_it_did_not_bite_here: >-
      Luck, plus two independent mitigations that happened to hold. The quality reviewer's RED
      output is internally consistent with the mutation being in effect during its run. The spec
      reviewer's own reproductions were race-IMMUNE by construction -- a scratch copy for AC4 and an
      in-process monkeypatch for AC2 -- because it is read-only and could not edit tracked source
      even had it wanted to. Neither reviewer's evidence is contaminated. But a slightly different
      interleaving corrupts the quality reviewer's mutation evidence, or worse, gives it a GREEN
      reading of a mutation that was silently reverted underneath it -- which would look exactly
      like "the guard does not detect this shape" and could have been reported as a finding.
    the_rung: >-
      NOT prose. This is an agent-definition or isolation problem: either the quality reviewer gets
      `isolation: worktree` when it probes, or its definition forbids mutating tracked files and
      requires the scratch-copy / monkeypatch technique the spec reviewer used unprompted and which
      worked perfectly. The second is cheaper and strictly better -- it makes BOTH reviewers
      race-immune by construction rather than by scheduling. Note the orchestrator caused this by
      dispatching concurrently as instructed; the instruction and the tool grant are what conflict.
    do_not: >-
      Do NOT "fix" this by serialising the reviews. Their independence and concurrency is the point,
      and four consecutive sprints have had the quality reviewer catch something the spec reviewer
      did not.

