goal: >-
  Find the boundary violations the eight contracts cannot see, and turn as many as possible into
  contracts that can. Deliverable is FINDINGS PLUS MECHANICAL GUARDS; every non-trivial fix is
  FILED as its own story, never done inline (PO ruling). Motivating fact: an inbound adapter
  persisting through a core port passes all eight lint-imports contracts while being
  architecturally wrong (STORY-190) -- so if one such gap exists, others are probably in the tree.
