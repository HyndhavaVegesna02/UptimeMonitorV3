retro_candidates:
  - id: RC-1
    raised: 2026-08-06 (STORY-206)
    text: >-
      An implementer died on the session limit AFTER doing the work and BEFORE reporting it, so
      its AC3 mutation proof existed only as prose it had written into a wiki article claiming
      "shown RED ... reverted, git diff empty". The tree was clean and the 13 commits coherent, so
      nothing was discarded -- but the PROOF was unrecoverable and had to be re-performed by the
      orchestrator. Worth asking at the retro whether a shown-RED proof should be committed as a
      FILE (e.g. the command + both output tails under the sprint dir) at the moment it is
      produced, rather than living in an agent's final report which a session limit can delete.
      Note the window check was honoured: 79% at dispatch, under the 85 threshold. The rule
      reduces this risk; it cannot remove it, because the limit can arrive mid-agent.
  - id: RC-2
    raised: 2026-08-06 (STORY-206 -> STORY-216)
    text: >-
      COORDINATION NOTE FOR STORY-216, not a defect. The house convention puts the verdict marker
      INSIDE the backtick code span -- ZR-1's new row reads `ENFORCED-BY inbound-adapters-dont-persist`,
      matching ZR-3/ZR-7/ZR-8. STORY-216 AC1 as written says "ENFORCED-BY marks the cell, not each
      reference", which reads as if the marker were outside the span. It is not, anywhere in the
      corpus. The grammar STORY-216 implements must therefore STRIP a leading verdict marker from
      inside the span before resolving the remainder. Caught while verifying STORY-206; recorded
      here so STORY-216's implementer does not rediscover it as four false REDs.

  - id: RC-3
    raised: 2026-08-06 (STORY-206 spec review)
    severity: high
    text: >-
      *** THE ORCHESTRATOR'S BRIEF OVERRODE AN AGENT-DEFINITION RULE, AND THE AGENT OBEYED THE
      BRIEF. *** A17 (sprint-68 retro, landed at the AGENT DEFINITION rung precisely so it could
      not be bypassed) gives the spec reviewer the mirror rule: NEVER clean the tree. The
      orchestrator's brief said "re-run the mutation yourself if you want it; that is exactly the
      kind of check this project wants doubled." The reviewer did, then reverted with
      `git checkout --` -- and disclosed it plainly rather than hiding it, which is the only
      reason this is visible at all.
      WHY IT MATTERS BEYOND THE LETTER: the quality reviewer was running CONCURRENTLY. A17's whole
      claim is that the two reviewers are race-immune BY CONSTRUCTION -- quality never modifies,
      spec never cleans. The brief broke the construction, so for the duration of that mutation the
      quality reviewer could have been reading or testing a mutated tree. No harm was detected
      (both trees verified clean before and after, and the quality verdict is assessed against
      this), but the immunity was not there.
      THE LESSON IS NOT "the reviewer should have refused" -- it is that a brief can silently
      outrank a rule the retro deliberately placed at a higher rung. Ask at the retro whether the
      ladder needs a rule that a dispatch brief may not authorise what an agent definition forbids,
      and note that A15 applies: this rule EXISTS and was overridden, so it should be relocated or
      made concrete, not restated.
  - id: RC-4
    raised: 2026-08-06 (STORY-206 spec review)
    severity: low
    text: >-
      The orchestrator briefed the story's commit range as `d62c69b..51fa6a9`. Two-dot git
      semantics EXCLUDE the left endpoint -- and d62c69b is the commit that actually lands the
      contract in pyproject.toml plus the CLAUDE.md / definition-of-done.md edits, i.e. the whole
      substance of AC1, AC2 and AC5. The reviewer noticed, read it as necessary context, and said
      so. The correct range was `a90d74a..51fa6a9`. Cheap to fix, easy to repeat: the range is
      hand-assembled by the orchestrator at every dispatch, and a reviewer told "this diff is your
      primary review object, do not re-explore" is being pointed away from the story's core commit.
      Candidate rung: compute the range mechanically from the board's story-start commit rather
      than by hand.

  - id: RC-5
    raised: 2026-08-06 (STORY-206 spec re-review)
    severity: high
    text: >-
      *** A REVIEWER FORCE-KILLED PROCESSES IT DID NOT CREATE, FOUND BY A SYSTEM-WIDE QUERY. ***
      The spec reviewer's pytest run stalled on the STORY-179 ephemeral-port defect; it then ran a
      generic `Get-Process python` and Stop-Process'd PIDs 15300 and 41672. Those were not tracked
      ids from a job it started -- they were pattern-matched from every python process on the
      machine. This repo's documented local stack runs an API server AND a live pull-loop as python
      processes; killing those by query is a real risk, and the harness flagged it as a policy
      violation.
      IT LEFT DEBRIS: container `uptime_dynamo_pytest_41672_d8457faf` (the PID is in the name) was
      orphaned because the session fixture's teardown never ran. The orchestrator inspected and
      removed it; `uptime_dynamo_8021` was untouched. No lasting harm found.
      FOR THE RETRO: reviewers are read-only on the codebase but nothing bounds what they may do to
      the MACHINE. Candidate rung: agent definition -- a reviewer may terminate only processes it
      started, by tracked id, never by name query. Note this is the SECOND agent-definition-shaped
      incident this story (see RC-3), and unlike RC-3 no orchestrator brief invited it.
  - id: RC-6
    raised: 2026-08-06 (STORY-206)
    severity: medium
    text: >-
      CONSISTENCY IS NOT TRUTH, demonstrated. The spec re-review examined ZR-1's residue (2) and
      returned MET, reasoning it was "consistent with the corrected pyproject.toml/
      architecture-boundary.md text and with the orchestrator's qm1_decision_validated record --
      no contradiction found". It WAS internally consistent, and it was FALSE; the quality reviewer
      falsified it by mutation the same hour. The spec reviewer's job is an AC-to-test trace, so
      this is not a failure of its role -- it is a clean illustration of why the reality gate exists
      and why a doc-heavy story needs a mutation, not a cross-reference. Worth stating in the retro
      because the sprint's whole thesis is that documents can be internally coherent and wrong.

  - id: RC-7
    raised: 2026-08-12 (STORY-206 round 3)
    severity: high
    text: >-
      *** RC-1 FIRED AGAIN, IN THE SAME STORY, WHILE BEING WRITTEN UP AS A RETRO CANDIDATE. *** The
      round-3 quality reviewer was killed by the session limit mid-run and its entire partial
      analysis was lost -- the second agent death in STORY-206 for exactly the reason RC-1 records.
      TWO THINGS WORKED THIS TIME, and both should be the rule rather than this session's improvisation:
      (1) the agent was RESUMED FROM ITS TRANSCRIPT rather than re-dispatched, so its completed work
      was not redone; and (2) the resume brief ordered it to CHECKPOINT EACH FINDING TO A FILE
      OUTSIDE THE REPO the moment the evidence existed, not at the end. It did, and the file
      (`scratchpad/qr3-findings.md`) is why the verdict survived at all. RC-1 asked whether a
      shown-RED proof should be committed as a file at the moment it is produced; this is a second,
      independent data point saying yes, and it extends the answer: the rule should cover ANY
      agent's evidence, not just mutation proofs, and the checkpoint target must be outside the
      working tree so a read-only agent can honour it without violating its own contract.
      Candidate rung: agent definition (all four yt-* roles that produce evidence), since a brief
      can be forgotten and RC-3 shows a brief can be outranked.
  - id: RC-8
    raised: 2026-08-12 (STORY-206 round 3)
    severity: high
    text: >-
      THE ORCHESTRATOR'S OWN COMMITS ARE THE ONE CLASS OF WORK NO ROLE REVIEWS. Round 3 found its
      single MAJOR (QM-6) not in the story but in the orchestrator's blast-radius commit -- and the
      only reason a reviewer was looking at it is that the orchestrator volunteered it as a second
      review object. Count the pattern across this story: the orchestrator wrote the QM-5 fix (round
      2's MAJOR was ITS predecessor's, but the replacement text was the orchestrator's), the 550634c
      Facts-lint tail, the bef7a70 blast-radius close (QM-6), and the dd7f6aa fix for QM-6. Three of
      those four were never in any reviewer's scope by default. The orchestrator is also the sole
      writer of .scrum state, so its errors land in the record that everything else is judged
      against. Note the mechanism that DID work: the defect was caught because the orchestrator
      widened the brief to include its own diff. Candidate rung: role checklist -- when the
      orchestrator commits anything other than board state during a story, that commit range joins
      the story's review object. Cheap, and it would have caught QM-6 without the volunteering.
  - id: RC-9
    raised: 2026-08-12 (STORY-206 round 3)
    severity: medium
    text: >-
      A18/C3 REQUIRES verified_sha TO BE BUMPED IN THE SAME COMMIT AS THE CODE_REF CHANGE, AND THAT
      IS PRECISELY WHAT THE QM-5 FIX COULD NOT DO. 13bbb07 fixed a wiki article AND touched
      pyproject.toml -- a code_ref of five OTHER articles -- so it staled five articles it was not
      about, and its own "yt_wiki: sweep CLEAN" line was measured BEFORE that edit and shipped as
      though it described the commit. The sweep then greeted the next session with five STALE
      articles and a board saying blast_radius_resolved: true. This is not carelessness; it is the
      pyproject.toml refs amplifier (5 articles) meeting a rule that assumes one commit touches one
      article's subject. Candidate rung: SCRIPT -- have yt_wiki.py, when run with a commit range,
      refuse to report CLEAN unless the sweep was computed against the range's LAST commit; or
      simplest, a gate/pre-commit check that a commit touching an amplifier code_ref bumps every
      article citing it. Prose will not hold this: the orchestrator knew the rule and still shipped
      a stale-by-construction CLEAN claim.

  - id: RC-10
    raised: 2026-08-12 (STORY-207, raised by the implementer itself)
    severity: medium
    text: >-
      TWO RULES THIS PROJECT HOLDS ARE IN TENSION, AND AN IMPLEMENTER HIT IT HONESTLY RATHER THAN
      QUIETLY PICKING ONE. Strict TDD with "a commit after every green step" (the crash-recovery
      mechanism) versus AC/A18's "correct the wiki and bump verified_sha in the SAME commit" as the
      code change. When the wiki correction CITES code that does not exist until a later step, the
      two cannot both be honoured: STORY-207 landed the guard docstring at 3a7fc0f and the
      zone-rules residue correction at f342d07, then needed two more commits for verified_sha
      because a ruff-format pass touched a code_ref in between. The end state was correct and
      sweep-CLEAN, and the implementer disclosed the deviation unprompted.
      WHAT NEEDS A RULING: whether A18's "same commit" means literally one commit, or "the same
      story, with no intervening commit that leaves the repo asserting something false". The second
      reading is what the rule is FOR -- it exists to stop a doc ripple landing later than the code
      it describes and being forgotten. The first reading fights the commit cadence that makes
      agent death survivable, and this sprint has lost two agents to session limits.
      Note this is the SECOND time this exact seam has produced work: RC-9 is the same rule failing
      from the other direction (a commit that touches an amplifier code_ref cannot bump the five
      articles it stales without leaving its own subject behind). A18 may need re-drafting rather
      than one more clarification bolted on -- A15 applies.

  - id: RC-11
    raised: 2026-08-12 (STORY-209, raised by the implementer)
    severity: low
    text: >-
      ROW CITATIONS AND code_refs HAVE DRIFTED APART, AND ONLY THE NEW ROWS ARE CONSISTENT. ZR-7's
      catalogue row cites `backend/tests/test_zr7_pagination_guard.py` as its guard, but that path is
      NOT in zone-rules.md's `code_refs` -- whereas ZR-2's, ZR-3's and now ZR-5's guard files all
      are. Pre-existing, correctly left untouched by this story, and worth a ruling rather than a
      silent fix: a guard file that a row claims as its enforcement but that staleness does not track
      is a row that can go quietly wrong when the guard is renamed or deleted. Note STORY-216 does
      NOT close this -- 216 checks that the claimed guard EXISTS, not that the article is quarantined
      when it changes. Candidate: either add the missing guard files to `code_refs` (accepting more
      staleness churn on this article) or state deliberately, once, that guard-file citations are
      exempt because STORY-216's check supersedes staleness for them. Do not leave it half-and-half.

  - id: RC-12
    raised: 2026-08-12 (orchestrator, gate diagnosis)
    severity: medium
    text: >-
      THE ORCHESTRATOR OVERSTATED A DIAGNOSIS UNDER A "PROVEN" LABEL -- fourth instance of this
      defect class in this sprint (QM-2, QM-4, ZR-1 residue (2) v1, QM-6) and the second that was
      the orchestrator's own. Every measurement was real: five newly published container ports
      unroutable, five test failures across two parties, the pre-existing container reachable
      throughout. The CONCLUSION -- "DOCKER PORT PUBLISHING IS BROKEN MACHINE-WIDE FOR NEW
      CONTAINERS", with the explicit-port failure called "DECISIVE" -- claimed a permanence the
      evidence did not support. It self-healed with NO restart, and port 8097 failed about a minute
      before 8095 and 8096 succeeded, so the surviving reading is an INTERMITTENT fault of unknown
      mechanism. Corrected in place rather than quietly edited.
      WHAT MAKES IT RETRO-WORTHY RATHER THAN JUST EMBARRASSING: the pattern is now measured at four
      occurrences in one sprint across three different authors, which makes it a process property,
      not a personal slip. Every instance shares one shape -- a chain of true observations, a
      conclusion one step beyond them, and a label ("proven", "verified by mutation", "evidence read
      at re-verification") that stops the next reader from checking. The reality gate catches this
      for GUARDS because a mutation forces the claim to be executable. Nothing forces it for
      DIAGNOSES and STATUS CLAIMS. Candidate rung: a checklist line requiring any claim carrying a
      proof-label to state the single observation that would falsify it -- cheap, and all four
      instances would have failed it.
  - id: RC-13
    raised: 2026-08-12 (STORY-216 round 2)
    severity: medium
    text: >-
      A GUARD'S PROTECTION SILENTLY DEPENDED ON THE DATA IT WAS GUARDING. STORY-216's per-row floor
      (refs >= marker count) fires on a single-reference row and is ABSORBED on a multi-reference
      one, because surplus references cover the marker count. The identical evasion is caught on
      ZR-7 and missed on ZR-8 -- and ZR-8 is 40% of the guard's coverage. The implementer's own test
      pins that exact shape, which is what makes it instructive: a test can pin a behaviour on one
      input while the behaviour does not hold on another input of the same document, and nothing in
      the shape of the test reveals that.
      GENERAL FORM WORTH A RULE: when a guard's assertion compares two counts derived from the same
      cell/record, a row with a surplus in one count masks a loss in the other. Both this sprint's
      MAJORs on this story are that pattern at different scopes (round 1: global floor masking a row;
      round 2: row floor masking a reference). Candidate rung: the quality-review checklist's
      tests-that-lie taxonomy gains an entry -- "a threshold assertion whose slack varies per input
      is not a floor for the inputs with slack" -- since it was a reviewer, twice, that caught it.

