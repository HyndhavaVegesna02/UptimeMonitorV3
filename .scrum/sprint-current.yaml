  - id: STORY-226
    title: ComponentConfig validation ergonomics
    points: 3
    order: 3
    status: done
    file: docs/scrum/stories/STORY-226-component-field-validation-ergonomics.md
    dispatched_at: >-
      Dispatched 2026-08-17. Window: 5h 54% | 7d 42%. Verdict: dispatch freely (<85). 7/15 banked
      (228 + 229). This is the ONLY story in sprint 74 that changes runtime behaviour -- the other
      three are documentation, tests and a glyph registry.
    ceremony: "implementer -> spec reviewer + quality reviewer (concurrent) -> gate -> reality gate"
    carry_into_brief: >-
      BOTH PO RULINGS ARE IN THE AC: the error shows the AUTHORED value AND the normalized one; an
      empty description normalizes to null AT LOAD.
      *** THE TRAP: the authored group is NOT available where the error is raised, because the field
      validator lowercases at CONSTRUCTION. The obvious fix -- move the check into the validator --
      is the EXACT failure STORY-147 documented twice: a ValueError subclass raised inside a pydantic
      validator becomes a ValidationError and LOSES ITS SUBCLASS. The check MUST stay in load_config,
      OUTSIDE the try/except. ***
      THE VERIFIED WAY THROUGH: `raw` is assigned at config.py:669-671 and is STILL IN SCOPE at the
      :755 raise site, so raw["components"] carries the authored group verbatim. JOIN ON comp.id
      (never normalized), not on list position.
      AC4 WAS REWRITTEN -- the draft was unsatisfiable-or-theatre. service.py:22-29 is an
      unconditional passthrough and the fake repo never invokes load_config, so AC3 is the guarantee
      and the API inherits it. DO NOT add a normalization step downstream to green a test.
      AC5: state the whitespace rule AS CODE. Recommended `None if not v.strip() else v` -- the
      alternative (`v.strip() or None`) moves the _MAX_DESCRIPTION_LENGTH boundary pinned at
      test_config.py:953.
    completed:
      final_head: f212901
      commits: 13   # dc83184..f212901, all implementer
      spec_review: >-
        PASS -- all seven AC. The reviewer VERIFIED HARD rather than reading: it built an isolated
        worktree at the pre-fix commit with PYTHONPATH forced to the worktree's backend/ (respecting
        the editable-install hazard CLAUDE.md documents, where src.* otherwise resolves to the MAIN
        tree and a worktree check silently tests the wrong code) to confirm AC2's test genuinely goes
        RED; and it probed the id-join with a two-component YAML where the INVALID component was
        listed SECOND.
      quality_review: "REQUEST CHANGES -> THREE MAJORs, all fixed."
      major_1_and_2: >-
        "description can never be '' at this seam" was one step beyond the evidence, asserted in BOTH
        service.py's docstring AND as a tier:map/status:verified wiki Fact -- the sentence a cockpit
        implementer would cite when deciding to drop their "" branch. ORCHESTRATOR VERIFIED THE
        FALSIFIER: dynamo_component_repository.py:35 reads .get("description") with NO normalization,
        and seed_topology_dynamo is upsert-only (put_item/update_item, NO delete_item anywhere), so a
        row seeded with "" while that was legal (STORY-147 -> this story) and later dropped from
        config keeps "" and reaches the DTO. Rescoped in both places -- and the fix went FURTHER than
        asked, correctly noting that group: "" has ALWAYS been a load-time error and so never had a
        legal-then-orphaned window, meaning that half holds unconditionally.
      major_3_the_orchestrator_supplied_the_bad_number: >-
        The new comment cited `raw` at :669-671; it is at :687, and :669-671 now lands inside
        load_config's docstring where it reads plausibly and cites nothing.
        *** THAT NUMBER CAME FROM THE ORCHESTRATOR'S BRIEF. *** It was correct when pre-lock
        verification measured it, and the story's OWN first hunk (+16 lines) moved it. Right when
        measured, wrong when written -- the exact failure class this project keeps hitting, with the
        orchestrator supplying a link in the chain. Fixed by DELETING the parenthetical: "assigned at
        the top of this per-file loop" needs no number and cannot rot.
      orchestrator_added_to_the_fix_round: >-
        The spec reviewer PROVED the id-join by hand-building a two-component case, but the committed
        test used a SINGLE component and so could not distinguish an id-join from a positional one.
        Required that case be put INTO the test -- verification that lives only in a review transcript
        protects nothing. Done: comp-a (valid) now precedes comp-b (invalid), asserting comp-a's
        authored value does not leak into the error.
      third_citation_regression_of_the_sprint: >-
        A bare `service.py:28` written in wiki prose became a genuine CITATION_RE match and moved the
        population 191 -> 192. Self-caught, fixed by reusing the existing SYMBOL citation. In the fix
        round the implementer then avoided a fourth by pointing at [[persistence-adapters]] instead of
        re-deriving with a fresh file:line. THREE implementers, THREE regressions, one mechanism, all
        caught by the gate. Retro material.
      reality_gate: >-
        PASS on BOTH PO rulings, through the REAL load_config, not a model construction.
        RULING 1: the error reads "component 'bad-comp' has an invalid `group`: authored as
        'Not Valid!', normalized to 'not valid!'" -- both values, exactly as ruled.
        RULING 2: description "   " -> None, "" -> None, AND "  Checkout surface  " preserved
        BYTE-IDENTICAL with its padding. That third row is the sharpest evidence -- it proves the
        implemented rule is `None if not v.strip() else v` and NOT `v.strip() or None`, which are
        distinguishable only on padded values and where the alternative would have moved the 80-char
        boundary test_config.py:953 pins.
