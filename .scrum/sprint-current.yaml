sizing_note: >-
  11 points across FOUR stories (210:2 + 199:3 + 202:3 + 200:3) -- the top of the stated ~9-11
  baseline, same total as sprint 66 but one fewer story. Composition changed post-lock: STORY-202
  went 2 -> 3 on the PO-approved scope expansion and STORY-201 (1) came out to hold the committed
  total. The sprint-66 retro found that fix-round cost is driven by story KIND, not size: an audit
  sprint's deliverable is prose, which fails review in ways code does not. This sprint's deliverable
  is code with mechanical proofs, so 11 is a considered call rather than a stretch.
  DROP ORDER if the SESSION runs short (not a standing trim -- the PO declined both reductions on
  offer): STORY-202 first now that 201 is already out. NEVER STORY-199 (the live production defect,
  the sprint's reason to exist) and never STORY-210 (it keeps the gate trustworthy for the rest).
ceremony_note: >-
  Four of five stories get BOTH reviewers, including two below the 3-point threshold, and that is
  deliberate. Sprint 66's evidence: both reviewers found real defects in EVERY story, several
  already accepted by the orchestrator, for the third sprint running. STORY-210 is 2 points but
  edits the DoD and the gate runner itself; STORY-202 is 2 points but touches the publish-guard
  mechanism. Only STORY-201 -- one line, unreachable code -- takes the small-story ceremony.
