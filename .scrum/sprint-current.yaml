    text: >-
      *** STORY-221 IS NOT A RARE FLAKE. MEASURED TODAY, THE UNMODIFIED `npm test` WENT
      FAIL / PASS / FAIL / PASS -- 2 RED IN 4 RUNS AT THE SAME COMMIT, WITH ZERO FRONTEND DIFF ALL
