        code_refs overlap this story's diff are updated OR RE-VERIFIED (verified_sha bumped)"), so
        the stamp vouches for the whole article. YourTeam core principle 5 settles it independently:
        knowledge may be incomplete, NEVER trusted-and-wrong. A `verified` stamp over a known-false
        Fact is exactly the forbidden fourth state.
        *** CORRECTED 2026-08-04 -- THE ORCHESTRATOR'S OWN JUSTIFICATION HERE WAS FALSE, AND THIS
        ENTRY IS THE PROOF THAT THE LEDGER IS NOT EXEMPT FROM THE RULE IT IS ENFORCING. ***
        The original text read: "`\r` is NOT incidental: it is the realistic case on this
        Windows-developed repo (CRLF in a config YAML), and post-STORY-204 it decides between one
        degraded signal and an aborted loop." That CRLF trigger DOES NOT EXIST. The orchestrator
        asserted it in a fix-round brief, the implementer reasonably took it at face value and wrote
        it into a `verified`-stamped wiki Fact, and the quality re-review then DISPROVED IT
        END-TO-END -- making the cure an instance of the disease it was curing.
        DISPROVED TWICE, independently: `load_config` reads via
        `yaml.safe_load(yaml_path.read_text(encoding="utf-8"))` (composition/config.py:611), and
        `Path.read_text()` applies UNIVERSAL-NEWLINE TRANSLATION, so `\r\n` becomes `\n` before
        PyYAML ever sees it. The reviewer proved it on scratch copies; the orchestrator then rewrote
        every line ending in config/apps/httpcheck.yaml to CRLF and loaded it through the real
        loader: native_id='HTTP_CHECK-38B092E93932C002', contains_CR=False.
        THE TRUE JUSTIFICATION, which needs no ingress story at all: `_DQL_BREAKING_CHARS` defends
        the DQL string against ANY breaking character regardless of provenance. The only VERIFIED
        route to a real `\r` in that scalar is an explicit `\r` escape inside a double-quoted YAML
        scalar -- which is not CRLF contamination.
        THE LESSON, and it is the sharpest of the sprint: an orchestrator assertion inside a brief
        is NOT evidence, and an implementer trusting it is not the implementer's error. Briefs must
        say what was verified and how -- or omit the claim.
