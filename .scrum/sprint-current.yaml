  - id: STORY-197
    title: Land the mechanical guards the audit earned, and adjudicate every rule
    file: docs/scrum/stories/STORY-197-land-the-guards-the-audit-earned.md
    status: done
    points: 3
    ceremony: implementer (stopped by PO mid-story) + orchestrator completion + BOTH reviewers + fix round
    result: >-
      DONE. Spec review PASSED all seven AC (AC1-AC7) after independently re-deriving all four RED
      proofs by mutation and re-running the full gate itself. Quality review returned FIX_REQUIRED
      with 3 MAJOR; the fix round below closed every one, each verified by probe rather than by
      reading. FINAL FULL 8/8 GATE GREEN: 689 passed / 0 SKIPPED, frontend 363 passed, yt_selftest OK,
      yt_wiki CLEAN on all four blocking checks.
      *** THE MOST IMPORTANT FIX, AND IT WAS DANGEROUS. *** ZR-7's guard decided "this method
      paginates" by finding the STRING LastEvaluatedKey anywhere in it. The reviewer added a realistic
      warn-on-truncation stopgap to is_under_maintenance -- still reading ONE page -- and the guard
      responded "now loops on LastEvaluatedKey; remove this exemption, the fix has landed", about the
      exemption covering THE LIVE PRODUCTION DEFECT. Following that instruction would have left the
      defect permanently unguarded. The guard asserted a conclusion its own proxy could not support.
      Fixed: the loop check is now per CALL SITE and requires the call to sit INSIDE a
      LastEvaluatedKey-bearing loop, and the message now says VERIFY IT ACTUALLY PAGES.
      THREE MORE BLIND SPOTS, each demonstrated GREEN by the reviewer against a deliberately
      unpaginated call site, all now closed and re-proven by probe: a repository in a SUBDIRECTORY
      (glob was not recursive), a MODULE-LEVEL function (only class bodies were walked), and a SECOND
      unpaginated call inside an otherwise-paginating method (loops was computed once per method and
      inherited). That last shape is realistic production code and is exactly the truncation ZR-7
      exists to catch. Probe results after the fix: stopgap FLAGGED, real loop PAGES, second call
      FLAGGED, module-level function FLAGGED, subdirectory repository FLAGGED.
      ZR-3's self-exclusion matched a BARE FILENAME, so any tools/**/citation_sweep.py anywhere was
      skipped -- the reviewer proved it by planting a genuine duplicate that passed, then renaming the
      file and watching it go RED. Now matched on the path relative to tools/, and re-proven.
      TWO FINDINGS AGAINST THE ORCHESTRATOR, both fair and both fixed:
        1. CLAUDE.md still instructed the blocked `pytest` and `cfn-lint` shims after I changed the
           DoD -- violating the very AC4 discipline this story enforces, in a file that already
           carried that exact workaround note for lint-imports. Fixed in three places, and the
           Device Guard note now records all three blocked shims together.
        2. My "8 citation-sweep failures, all false" count was STALE -- it is 11. The limitation
           prose I wrote itself introduced three new bare-filename regex matches, and I never re-ran
           the count afterwards. Caught by spec review under exactly the C2 rule this sprint applied
           to everyone else. Corrected, re-derived, and the cause recorded in the article.
      ALSO CORRECTED FOR HONESTY: ZR-8's deferral reason claimed a guard would be RED on real code and
      C4 forbids that -- but ZR-3 and ZR-7 were in precisely that position and this same story solved
      it with exemption lists, so that was a false excuse. The real reasons are AC5's two-guard cap
      plus the fact that ZR-8's violations are whole-function SHAPE rather than per-site coordinates,
      which makes an exemption list a far blunter instrument there. ZR-6's row now carries its own
      verdict's requirement that it is guardable only as a reviewed warning, never a hard contract.
      WIKI BLAST RADIUS handled properly rather than re-stamped: the DoD change marked
      dev-setup-and-dod.md stale (two of its code_refs), so its command list was UPDATED with the
      Device Guard reason and date, mirroring how it already recorded the 2026-07-12 lint-imports
      block. zone-rules.md re-stamped twice, each time after a real re-read of what changed.
      WAS BLOCKED EARLIER at AC7 by the Device Guard regression -- the PO approved the DoD invocation change and the FULL 8/8 GATE IS NOW
      GREEN at 8e18b6d: python -m pytest 689 passed / 0 SKIPPED, all three frontend commands pass,
      yt_selftest OK. AC7 is satisfied. Awaiting the reviewer pass the PO asked for; every other AC
      was already met.
      WAS BLOCKED AT AC7 BY AN ENVIRONMENT REGRESSION, NOT BY ITS OWN WORK. Every other AC is met and
      verified; the story is NOT marked done because the mechanical floor says a nonzero exit is a
      nonzero exit, no exceptions. The PO decides at review.
      WHAT IS DONE AND PROVEN. Two guards landed, and unusually for this repo BOTH were shown RED by
      the ORCHESTRATOR re-deriving the proofs, not by trusting a self-report -- the implementing
      agent was stopped by the PO after commits 19fee13/e2fffae/0ba21d0 and could not be resumed.
        ZR-7 -> backend/tests/test_zr7_pagination_guard.py (2 tests). RED-proven TWICE: removing the
          is_under_maintenance exemption trips the unexempted-violation check, and exempting a call
          site that already loops trips the STALE-exemption check (the branch that stops a landed fix
          leaving a rotting entry behind).
        ZR-3 -> backend/tests/test_zr3_duplicate_declarations.py (2 tests), promoting the committed
          tools/zr3_duplicate_sweep.py. RED-proven by injecting a fresh duplicate of
          Settings.dynamo_observations_table's default into a non-excluded tools/ module.
      A NEGATIVE RESULT WORTH KEEPING: the same injection into tools/citation_sweep.py did NOT trip
      the guard. That is CORRECT -- _SELF_EXCLUDE_NAMES skips the two sweep scripts, whose own
      literals are inherently noisy -- but a green result there looks exactly like a blind spot on
      first inspection, so it is written down. The exclusion matches on BARE FILENAME, which is
      broader than intended; a relative-path match would be tighter (noted, not fixed).
      THE LIVE-VIOLATION PROBLEM, resolved deliberately: three of the strongest guard candidates had
      live violations, and a zero-tolerance guard would have turned the DoD gate RED and blocked
      every future story until the fix stories land -- which C4 forbids as a side effect of a guard.
      Both guards therefore carry enumerated exemption/adjudication lists where EVERY unfixed entry
      names its fix story (STORY-199 / STORY-202 / STORY-203). Green today, loud on anything new,
      and shrinking as fixes land. The per-entry fix-story citation is the whole difference between
      an exemption list and a permanent suppression list.
      AC6 CLOSED THE LOOP: zone-rules.md now carries an authoritative Adjudication table -- ZR-3 and
      ZR-7 ENFORCED-BY their tests, the other six GUARDABLE-DEFERRED behind named stories
      (STORY-206..209 filed for the four ready guards; ZR-6 waits on STORY-200's design decision,
      ZR-8 on its two fix stories), and ZR-5's operational half recorded UNGUARDABLE with its reason
      (two OS processes, each reading its own env -- no single-process test sees across that).
      verified_sha re-stamped ONLY after a real re-read, during which the committed citation_sweep
      reported 8 failures that ALL PROVED FALSE on direct inspection (two cite a memory file outside
      the repo; six fail the content-anchor heuristic while the cited lines are exactly right). That
      limitation is now recorded IN the article so a later story does not "fix" correct citations.
      AC4 was a verification rather than an edit: both guards are pytest tests, so the contract count
      stays at EIGHT and every statement of it remains accurate (grep-verified). STORY-206 takes it
      to nine and must update them all.
      *** WHY IT IS BLOCKED (AC7). The full 8/8 gate exits 1: pytest -> FAIL(4551) and cfn-lint ->
      FAIL(4551), both "blocked by your organization's Device Guard policy". PROVEN environmental to
      the standard the 2026-07-06 agreement demands, not merely asserted:
        - pytest passes in isolation via the module form -- 689 passed, 0 SKIPPED (685 + the 4 new
          guard tests), so the code is green and only the .exe shim is blocked;
        - cfn-lint is blocked one level deeper, even via python -m cfnlint ("DLL load failed while
          importing _regex: An Application Control policy has blocked this file"), so the module
          form is NOT a workaround for it the way it is for pytest;
        - infra/ is UNTOUCHED for the whole sprint, so cfn-lint's input is byte-identical to runs
          that passed green earlier the same day;
        - reproduced twice back to back; the other six commands pass, frontend included.
      This REGRESSED MID-SPRINT: the baseline at d4ad03e was a full 8/8 green with the same runner.
      Filed as STORY-210, which BLOCKS EVERY FUTURE STORY until fixed. There is direct precedent for
      the fix in this repo -- the same policy blocked lint-imports.exe and the DoD command was
      changed to the module form -- but editing .scrum/definition-of-done.md is a PO decision and I
      have not touched it. ***
      ALSO OUTSTANDING: no spec or quality review has seen this story. Both reviewers found real
      defects in all three previous stories, so that gap is material and should be closed before the
      guards are trusted further.
