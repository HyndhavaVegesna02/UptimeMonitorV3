started: "2026-07-28"   # locked on PO approval of the twice-verified plan
# ── Provenance ────────────────────────────────────────────────────────────────
# This sprint follows the PO's rejection of the sprint-59/60/61 operator cockpit
# ("i dont like this ui also", 2026-07-28) and the sprint-61 abort
# (docs/scrum/sprints/2026-07-22-sprint-61/aborted.md, keep-all-unmerged).
# Planning artefacts, all in docs/scrum/sprints/2026-07-28-sprint-62/:
#   ui-backend-gap-analysis.md     — the new reference UI vs the api/v1 surface; PO decisions §3a
#   config-shape-proposal.yaml     — the nested authoring shape (PO: "this shape looks good")
#   calculations-under-new-config.md — full calculation walkthrough + the two defects it surfaces
#   decisions-and-future-work.md   — D1-D4 decided, F1-F3 future work
#   program-roadmap.md             — option (a) split across sprints per PO pacing directive
#   plan.md                        — this sprint's contracts, steps, reality gates
# ── Scope discipline ──────────────────────────────────────────────────────────
# PO approved scope option (a) (~21 pts) but directed "do it multi sprint, with carefull
# verification, no need to rush in single stretch" — so it is SPLIT. This sprint is 9 pts,
# at the ~9-11 baseline. Frontend lands sprint 63+ (design system + shell first, with a PO
# look-and-feel checkpoint BEFORE six pages are built on the language — the pilot fix for the
# process failure behind three rejections).
# Scope changes across the two verifier passes, all PO-approved at lock:
#   STORY-148 SPLIT into 148 (wire contract, 3) + STORY-176 (fleet + loop run) after being
#     assessed at 7-8 pts as one story;
#   STORY-147 DEFERRED to 63 where its consuming frontend lands (decorative until then, and it
#     now depends on the ConfigError hierarchy STORY-146 introduces);
#   STORY-176 DEFERRED to 63 (D-B) and rescoped to UP+absence (D-A), re-estimated 3 -> 4;
#   STORY-146 re-estimated 3 -> 5 (13-file test migration surface the plan had understated);
#   STORY-177 CREATED (D-A) as the first-class provisional-failure-mapping story.
# Total programme scope is unchanged; it is redistributed across 62/63.
# EXPLICITLY OUT: all frontend work; STORY-147 + STORY-176 (both 63); STORY-177 (draft, needs
# refinement); STORY-150 (breadth model D1/D2), STORY-151 (per-component decision rollup),
# STORY-152 (expected-locations completeness), STORY-153 (rejection suppression F1), STORY-154
# (map real failure codes — BLOCKED on trial renewal), STORY-155 (sample_mode removal),
# STORY-173 (leaked-container fixture fix).
# ── Live-data caveat ──────────────────────────────────────────────────────────
# The Dynatrace trial expired 2026-07-28: no observations arrive, nothing is reality-gateable
# against real vendor data, and sample_mode (which flips already-normalized rows) is inert.
# STORY-148 exists to replace that. Its reality gate is therefore a FIELD-AND-SCALE comparison
# against a real captured fixture (backend/tests/fixtures/dynatrace/grail_synthetic_events.json)
# plus a round trip through the REAL make_grail_executor over real HTTP — not "the loop didn't
# crash".
# NOTE (PO decision D-A): the engine emits NO failure-coded rows at all this sprint, so there is
# no "assumed vendor codes" caveat to carry — map_synthetic_status RAISES on anything that is not
# "0"/"HEALTHY" (health_mapping.py:65-70) and dispatch.py:80 then discards the whole batch, so a
# failure row is not an unverified row, it is an unusable one. Failure-path ingest arrives with
# STORY-177. Nothing in this sprint may be reported as "the failure path is tested".
# ── Safety precondition (non-negotiable) ──────────────────────────────────────
# decide publishes RECOVERIES WITH NO HUMAN GATE (core/services/decide.py:122-126), so any loop
# run wired to the real publisher can post to the LIVE public Statuspage.
# NO DEMO LOOP RUNS THIS SPRINT (STORY-176 moved to 63), so the demo guard moves with it —
# recorded in STORY-176 AC3: a CONFIG-ONLY guard (no statuspage_component_id => mapping {} =>
# publish_helper.py:211 falls through to LoggingPublisher on BOTH roots even with real creds),
# PLUS CONFIG_DIR set on the API process, which the 2nd verifier pass found is a separate
# process reading its own config (settings.py:32 defaults to config/apps, whose httpcheck.yaml:6
# carries a real statuspage_component_id).
# THE ONE LOOP RUN IN THIS SPRINT is STORY-146's reality gate, and it uses the REAL config/apps
# (mapping non-empty) with the real .env (run.py:178). It therefore RUNS WITH STATUSPAGE_API_KEY
# UNSET, recorded in the evidence — today it is otherwise safe only circumstantially (expired
# trial => no observation => no verdict; Dynamo -inMemory).
# ── Baseline ──────────────────────────────────────────────────────────────────
# First full-gate attempt on this branch was RED: `npm run build` exit 1. Diagnosed as
# ENVIRONMENT staleness, not a code defect — the on-disk frontend/node_modules was left from
# the sprint-59+ line (@fontsource/inter) while main's frontend declares @fontsource/geist +
# geist-mono, so the @import could not resolve. `npm install` restored it (021c9b6 records the
# 23 additive optional platform transitives; no real dependency version changed). Full-gate
# evidence recorded below at lock.
