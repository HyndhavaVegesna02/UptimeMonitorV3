  THE PO'S FRAMING, ANSWERED DIRECTLY: "full audit implementations done in 2 sprints."
  Nine stories, 20 points, ~10 per sprint against a recent velocity of 9/7/8/13/11/11.
    SPRINT 68 -- FIX WHAT IS BROKEN (10 pts): 205 (3), 204 (2), 203 (2), 215 (3)
    SPRINT 69 -- GUARD WHAT IS CLEAN (10 pts): 206 (2), 207 (2), 208 (1), 209 (2), 216 (3)
  WHY THIS SPLIT AND NOT AN EVEN MIX. The sprint-69 four are all CLEAN-TREE rules -- no violation
  exists to catch, so each is proven by MUTATION rather than by demonstration. That is a different
  working mode from sprint 68's and mixing them halves both. More decisively: STORY-216 asserts
  that every ENFORCED-BY row names a guard that EXISTS, and 206/207/208/209 flip four rows INTO
  ENFORCED-BY. It must run after them, which pins it to sprint 69 and pulls its siblings with it.
  WHEN SPRINT 69 CLOSES, EVERY ZR-1..ZR-8 RULE HAS A TERMINAL VERDICT. ZR-6 has no standing guard
  BY DESIGN (its own Coverage verdict rules out a hard-failing contract) and ZR-5's operational
  half is UNGUARDABLE (no single-process test sees across the two-OS-process boundary that caused
  the sprint-64 incident). Both are already stated in the catalogue; neither is a gap left open.
  DELIBERATELY OUTSIDE THE CLOSURE SET: STORY-214 (shared pagination helper + ZR-7 guard rework) --
  spawned by sprint 67's fix, not an audit finding; ZR-7 is already ENFORCED-BY with a one-entry
