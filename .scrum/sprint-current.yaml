# decide DECIDES to publish recoveries with no human gate (decide.py:122-126) and PUBLISHES at
# decide.py:171-172, so any loop wired to the real publisher can post to the LIVE public
# Statuspage. NO LOOP IS STARTED IN THIS SPRINT AT ALL. That is precisely why STORY-176 ships the
# guard a sprint AHEAD of STORY-182's run: the guard's checks are exactly what must pass BEFORE a
# loop may start, and giving the run its own story makes that ordering impossible to reshuffle.
# The verifier found a BYPASS in the guard as first written — a demo component id colliding with
