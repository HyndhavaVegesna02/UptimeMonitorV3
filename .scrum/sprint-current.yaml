  - id: RC-9
    raised: 2026-08-12 (STORY-206 round 3)
    severity: medium
    text: >-
      A18/C3 REQUIRES verified_sha TO BE BUMPED IN THE SAME COMMIT AS THE CODE_REF CHANGE, AND THAT
      IS PRECISELY WHAT THE QM-5 FIX COULD NOT DO. 13bbb07 fixed a wiki article AND touched
      pyproject.toml -- a code_ref of five OTHER articles -- so it staled five articles it was not
      about, and its own "yt_wiki: sweep CLEAN" line was measured BEFORE that edit and shipped as
