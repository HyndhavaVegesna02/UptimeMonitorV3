      GATE: 5/5 scoped PASS, 685 passed / 0 SKIPPED, merged verbatim below. yt_wiki CLEAN on all four
      blocking checks. C1 diff-scope empty, verified by the orchestrator.
    order: 3
    plan_note: >-
      85 modules (api 55 + composition 13 + tools 17 -- V1). HIGHEST-YIELD SURFACE IN THE SPRINT:
      lint-imports sets root_package = "src", so the tools/ -> src/ one-way rule and the
      no-duplicated-constant rule have ZERO mechanical coverage today (V6). AC3's sweep must be
