    gate, not a pass.
  scoping: >-
    Per-story gates MAY be --only scoped mid-sprint. The FULL 8/8 gate at the final HEAD is mandatory
    and is the evidence of record. NOTE STORY-178: yt_gate.py exits 0 when --only matches nothing --
    a false green on the floor. Check the command list it actually ran.

# --- Standing constraints carried into this sprint --------------------------
standing:
  publish_safety: >-
    NEVER run `python -m src.composition.run` -- decide publishes recoveries with NO human gate, to
    the LIVE public Statuspage. If create_app() is constructed, PIN CONFIG_DIR=config/demo. Verified
    at lock: config/demo/ declares no statuspage_component_id, so the config-only guard is intact.
  agent_evidence: >-
    CHECKPOINT AGENT EVIDENCE OUTSIDE THE REPO, to the session scratchpad. Three agents died mid-task
    in sprint 69; the two told to checkpoint lost nothing. This is what STORY-212 is landing at the
    script rung -- until it does, the prose rule is all there is.
  import_root: >-
    The editable install is a plain absolute sys.path entry: src.* resolves to the MAIN tree from a
    worktree or scratch copy unless the launch dir contains a src/ package. Pin PYTHONPATH on the
    command and assert the resolved root.
  device_guard: "Console-script shims blocked -- module form only (pytest, ruff, cfn-lint, lint-imports)."
  git_guard: "A PreToolUse hook BLOCKS bulk git staging during an active sprint. Stage explicitly."
  window_check: "At every AGENT BOUNDARY, not per story. Pause with a committed handoff before the session limit bites."

