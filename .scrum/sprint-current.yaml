board:
  - id: STORY-221
    title: "`npm test` false-reds under gate load (MaintenancePage)"
    points: 3
    order: 1
    status: in_progress
    file: docs/scrum/stories/STORY-221-frontend-gate-flake-maintenance-page.md
    dispatch_reverify: >-
      RE-VERIFIED AT DISPATCH 2026-08-14 (plan risk 7), all three planning measurements HOLD at
      bb480d1: userEvent.setup() at 66 sites across 20 files with ZERO non-default-argument call
      sites (so `delay: null` is nowhere in the suite yet); the 10 datetime-local user.type calls at
      MaintenancePage.test.tsx:286, 287, 332, 333, 366, 367, 399, 400, 437, 438 exactly as cited;
      frontend/vite.config.ts declares environment/globals/setupFiles/css ONLY -- no pool,
      poolOptions or fileParallelism -- confirming AC2's prohibition there is PREVENTIVE, closing a
      route that is currently open rather than describing an existing setting.
      WIKI: frontend-zone.md is tier=map, status=STALE -> QUARANTINED, so none of its claims enter
      the brief. MaintenancePage.test.tsx is in NO article's code_refs. NOTE frontend/src/test/
      setup.ts IS a code_ref of frontend-zone.md -- if the fix lands there the sweep will say so
      after the last commit; do not pre-declare it (plan-verification.md:19).
    ceremony: "implementer -> spec reviewer + quality reviewer (concurrent) -> gate -> reality gate"
    why_first: >-
      It taxes everything after it. This sprint runs `npm test` many times; at the filed 2-in-4 rate
      every later gate red must go through the two-limb attribution protocol before it can be
      believed. Fixing it first is the only ordering in this sprint that pays for itself.
    carry_into_brief: >-
      MEASURED SEAM: userEvent.setup() is called with DEFAULT options at 66 sites across 20 files.
      user.type() on a datetime-local field types the full '2026-07-09T09:00' literal -- 16
      keystrokes, so 16 AWAITED MACROTASKS per field -- at MaintenancePage.test.tsx:286, 287, 332,
      333, 366, 367, 399, 400, 437, 438. That is 10 user.type calls across 5 tests, ALL IN ONE FILE;
      no other test file in the suite types a datetime-local. That containment is what holds the
      estimate at 3.
      CONFIRMED VIABLE AT VERIFICATION: userEvent.setup({ delay: null }) works -- utils/misc/wait.js
      returns early when typeof delay !== 'number' -- so AC2 does not block the story by construction.
      HONEST NEGATIVE IS PERMITTED AND MUST NOT BE MANUFACTURED: it went 2-in-4 on 2026-08-06 but
      0-in-3 across sprint 71's full gate runs. Two flakes in this repo evaporated before their fix
      (STORY-178; STORY-213 at 0-in-12). AC1 explicitly allows a negative; AC4 forbids presenting an
      uncomparable before/after as if it were one.
      AC3 IS THE PROOF THAT MATTERS: mutation -- the 5 affected tests must still FAIL when the 422
      render is broken. A faster test that no longer tests is the failure mode here.
    commits: "e60b3c7 (single commit; 5 call sites + comments, 16 insertions / 5 deletions, one file)"
    implementer_report: >-
      *** THE FLAKE DID NOT REPRODUCE, AND THE IMPLEMENTER SAID SO RATHER THAN MANUFACTURING ONE.
      AC1 8 gate-shape runs at dc28502: 0 failures in 8. AC4 8 more at e60b3c7: 0 failures in 8. ***
      Both sides 0-in-8, so there is NO before/after delta and the report explicitly declines to
      present one -- which is what AC4 demands. The fix rests on the seam analysis plus AC3's
      mutation proof, not on a flake-rate improvement. Recent history is now 0-in-4 full gate runs
      (sprint 71) + 0-in-1 (this sprint's baseline) + 0-in-16 here.
      CHANGE: the 5 userEvent.setup() sites preceding the 10 datetime-local user.type calls become
      userEvent.setup({ delay: null }). Nothing else under frontend/ touched -- vite.config.ts,
      package.json and tsconfig*.json verified unchanged (AC6).
      AC3 CLAIMED: mutating useMaintenance.ts::schedule to `return true` failed exactly the 5
      affected tests, 8 others green; mutation reverted, empty diff verified.
      AC7 CLAIMED: full 8-command gate at e60b3c7, exit 0, 816 passed / 0 skipped, 51 files / 363
      tests in 58.75s. Wiki sweep CLEAN, nothing to update.
      *** THE NUMBER THAT DOES NOT FIT, AND IT IS FLAGGED FOR BOTH REVIEWERS: npm test got SLOWER,
      not faster -- mean 50.02s -> 55.65s (+11.2%), median 47.34s -> 53.36s (+12.7%). *** Removing
      32 awaited macrotasks per affected test should be FASTER. The implementer attributes it to
      system-load noise (observed range 44-82s) and notes the change touches 5 of 363 tests, so a
      real effect would have to be large per-test. Under AC5's stated 20% threshold and disclosed
      rather than absorbed -- but "disclosed" is not "explained", and both reviewers were asked to
      form their own view.
    orchestrator_independent_checks: >-
      Verified BEFORE dispatching reviewers, not taken on report: tree CLEAN; diff is exactly one
      file, 16 insertions / 5 deletions; `git diff --stat dc28502..e60b3c7 -- .scrum/` EMPTY, so the
      implementer wrote no orchestrator state and did not git-stash (the STORY-222 MAJOR did not
      recur); no leftover mutation in useMaintenance.ts.
    review_dispatched: >-
      Spec + quality reviewers dispatched CONCURRENTLY 2026-08-14 on range dc28502..e60b3c7. Both
      briefs require the AC3 mutation to be RE-RUN independently rather than accepted, and both were
      pointed at the wall-clock anomaly and at whether `delay: null` changes test SEMANTICS (fake
      timers, observation points for change/input handlers) and not merely speed.

  - id: STORY-224
    title: The 7 skill-test modules join the DoD gate
    points: 3
    order: 2
    status: todo
    file: docs/scrum/stories/STORY-224-skill-tests-outside-the-gate.md
    ceremony: "implementer -> spec reviewer + quality reviewer (concurrent) -> gate -> reality gate"
    why_second: >-
      So the rest of the sprint exercises the 9th command for real, in anger, rather than the new
      command being proven once and never used again.
    carry_into_brief: >-
      SHAPE (a) IS SETTLED BY MEASUREMENT, NOT PREFERENCE: .scrum/definition-of-done.md and
      yt_gate.py are in NO article's code_refs (radius 0); pyproject.toml -- the filing's obvious
      one-line fix -- is a code_ref in FOUR verified map articles, each of which A18 would force
      re-verified inside the story. yt_selftest.py measured 89 tests / 4.84s / exit 0 at HEAD,
      stdlib-only, so no tooling-freeze problem.
      *** PLACEMENT IS LITERAL AND WAS A CRITICAL AT VERIFICATION: a THIRD
      `## Commands (skill self-test)` section AFTER the frontend section, no "run from `dir/`"
      phrase. Appending to the backend section yields command 6 of 9 and silently makes
      CLAUDE.md's "Backend (5)" six. ***
      AC8 IS NOW GREEN AT DISPATCH -- the orchestrator bumped next_story_id to 226 in the lock
      commit. Add the assertion only; do NOT edit .scrum/backlog.yaml. Its shown-RED comes from a
      scratch-clone mutation.
      *** AC8 TRAP FOUND AT THE LOCK, 2026-08-14 -- 13 STORY IDS ARE NOT NUMERIC. *** The split
      stories carry letter suffixes: STORY-014b, 014c, 015a-015g, 040a, 016a, 016b, 016c. The
      obvious implementation `int(sid.split("-")[1])` RAISES ValueError on the first of them, so the
      assertion would go red for a reason that has nothing to do with the counter -- the exact
      false-red shape this sprint exists to remove. Parse with a numeric-prefix match
      (re.match(r"STORY-(\d+)", sid)) and TEST a suffixed id explicitly. Verified at lock:
      max numeric id 225, next_story_id 226, assertion holds.
      AC3 MUST DISTINGUISH EXIT 1 FROM EXIT 3: yt_gate.py:427-437 refuses a dirty tree with exit 3
      BEFORE running anything, and A20 (yt_gate.py:125) exempts only .scrum/ paths. The mutation
      must be COMMITTED in a scratch clone or the red proves the refusal, not the command.
      AC9: demo-engine.md:617 and :636 record HISTORICAL "DoD gate 8/8" evidence. Those must NOT
      become 9/9 -- they describe runs that happened under the 8-command gate.

  - id: STORY-173
    title: Reap the leaked DynamoDB Local container at session start
    points: 2
    order: 3
    status: todo
    file: docs/scrum/stories/STORY-173-dynamo-container-leak.md
    ceremony: "implementer -> gate -> reality gate (1-2 pts: no review pair)"
    carry_into_brief: >-
      *** PLACEMENT IS DECIDED AND IT IS THE WHOLE STORY: reap BEFORE resolve_dynamo's step-1
      short-circuit. *** resolve_dynamo returns at scripts/dynamo_local.py:335-337 when
      DYNAMO_ENDPOINT_URL is set -- WHICH IS THE GATE'S OWN CONFIGURATION -- so a reaper placed
      after it would be dead code precisely where it is needed. This is STORY-179's AC8 trap applied
      forward, caught at planning this time instead of at review.
      THE INJECTION SEAM MUST BE ADDED AND NAMED: resolve_dynamo is today
      `resolve_dynamo(*, env, docker_available, spawn_container)` (dynamo_local.py:319-323), with no
      reaper parameter. Follow that convention -- keyword-only Callable | None = None falling back
      to the module-level implementation.
      *** AC2 IS THE HALF THAT MATTERS: a reaper that removes too much is worse than none. *** The
      gate's own container is `uptime_dynamo_8021`, OUTSIDE the `uptime_dynamo_pytest_` pattern;
      destroying it breaks the gate mid-run. Three shown-RED negatives: live PID untouched,
      non-matching name never removed, no broad `docker rm -f` or wildcard prune in the diff.
      WINDOWS FACTS MEASURED AT VERIFICATION -- DO NOT RE-DERIVE, DO NOT ASSUME POSIX SHAPES:
      (1) os.kill(pid, 0) does NOT terminate the process, and on a dead/nonexistent PID it raises a
      bare OSError with winerror == 87, NOT ProcessLookupError -- a reaper catching only
      ProcessLookupError RAISES, violating AC4. Branch on winerror and test it.
      (2) A still-open process handle makes a DEAD pid read as ALIVE -- keep the conservative
      branch, and consider pairing liveness with an age bound against PID recycling.

