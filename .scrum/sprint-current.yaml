        at make_grail_executor; this drove the two COMPOSITION-level callers the real loop actually uses
        -- adapters/inbound/dynatrace/adapter.py::fetch_observations (the pull loop''s entry: build_dql_query
        -> executor -> normalize_rows) and composition/vendor_health.py::check_vendor_id_health (the startup
        probe) -- over real HTTP against a running DemoEngineServer, using the REAL unmodified make_grail_executor
        with its own default httpx. 19 assertions, every one two-sided where a one-sided version could
        pass on a broken engine.'
      result: '19/19. Nanosecond scale survives end-to-end: latencies returned [755, 755, 755, 1234] ms
        through the real assembler, so the units trap is closed in reality and not only in a unit test.
        The watermark bound genuinely discriminates: 4 observations at watermark == t1 vs 1 at t1+1s,
        with the timestamp on a WHOLE SECOND -- the shape where isoformat() drops the fraction entirely
        and a string comparison reproduces the STORY-051 stall. Unknown monitor id -> 0 observations,
        so the filter clause really filters. Three locations at one instant stayed three observations
        (no aggregation). AC8 held under execution: the assumed code=''1''/''UNHEALTHY'' row reached the
        real, unmodified map_synthetic_status and raised UnknownVendorStatusError -- and took the whole
        batch with it (dispatch.py:80''s bare comprehension), which is the blast radius STORY-177 must
        address.'
      two_sided_note: 'check_vendor_id_health SWALLOWS every exception and only logs (vendor_health.py:99-110),
        so a probe that merely called it would report success on a totally broken engine. The gate captures
        the log stream instead: SILENT for a configured id present in the store, loud VENDOR-ID DRIFT
        SUSPECTED for an absent one. Only the pair discriminates.'
      own_error_corrected: 'One of the 19 checks initially passed for a BOGUS reason. It asserted that
        an empty api_token is rejected -- but api_token='''' yields the header value ''Api-Token '', and
        httpx/h11 REFUSES to transmit a header value with a trailing space (LocalProtocolError: Illegal
        header value). The request never reached the server, so the engine did nothing and the assertion
        was a tautology dressed as an auth test. Replaced with what was then verified by probe: the engine
        checks the ''Api-Token '' SCHEME PREFIX only -- wrong scheme and absent header both 401, an arbitrary
        junk token returns 202. That is a sound demo simplification (it has no notion of a valid Dynatrace
        token) and satisfies AC6, which pins the header''s PRESENCE -- but it is NOT token validation,
        and must not be reported as such.'
      scope_honesty: Per PO decision D-A this engine emits UP + absence only. Nothing here may be reported
        as 'the failure path is tested' -- the failure path is proven REJECTED, which is the opposite
        claim.
