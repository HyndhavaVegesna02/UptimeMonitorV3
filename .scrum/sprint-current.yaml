    plan_note: "AC2-vs-AC5 IS SETTLED, NOT OPEN, and the evidence is documented: replacing
      STORY-180's test_results_cache_is_evicted_after_being_polled is the correction AC2 mandates,
      NOT a wire-contract change AC5 forbids. That test's own docstring attributes it to 'STORY-180
      AC4 (minor 5)' (test_server.py:92-96) and the pop comment attributes the consume semantics to
