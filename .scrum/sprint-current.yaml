retro_candidates:
  - id: RC-1
    raised: 2026-08-04 (STORY-205)
    severity: real, caught by luck rather than by design
    title: >-
      CONCURRENT REVIEWERS RACE ON THE WORKING TREE -- the quality reviewer MUTATES source to probe,
      and the spec reviewer restored its mutation mid-flight.
    what_happened: >-
      The skill mandates the two reviews run CONCURRENTLY because they are independent judgements.
      But yt-quality-reviewer is told it may mutate to probe (restoring afterwards), while
      yt-spec-reviewer is read-only and treats a dirty tree as something to clean. On STORY-205 the
      spec reviewer opened its session, found topology_keys.py locally modified
      (`_COMPONENT_SK_PREFIX = "COMPONENTX#"` -- the quality reviewer's live probe), correctly
      judged it was outside the reviewed diff, and ran `git checkout --` on it. It then REPORTED the
      stray mutation to the orchestrator, which is the only reason this was noticed at all.
    why_it_did_not_bite_here: >-
      Luck, plus two independent mitigations that happened to hold. The quality reviewer's RED
      output is internally consistent with the mutation being in effect during its run. The spec
      reviewer's own reproductions were race-IMMUNE by construction -- a scratch copy for AC4 and an
      in-process monkeypatch for AC2 -- because it is read-only and could not edit tracked source
      even had it wanted to. Neither reviewer's evidence is contaminated. But a slightly different
      interleaving corrupts the quality reviewer's mutation evidence, or worse, gives it a GREEN
      reading of a mutation that was silently reverted underneath it -- which would look exactly
      like "the guard does not detect this shape" and could have been reported as a finding.
    the_rung: >-
      NOT prose. This is an agent-definition or isolation problem: either the quality reviewer gets
      `isolation: worktree` when it probes, or its definition forbids mutating tracked files and
      requires the scratch-copy / monkeypatch technique the spec reviewer used unprompted and which
      worked perfectly. The second is cheaper and strictly better -- it makes BOTH reviewers
      race-immune by construction rather than by scheduling. Note the orchestrator caused this by
      dispatching concurrently as instructed; the instruction and the tool grant are what conflict.
    do_not: >-
      Do NOT "fix" this by serialising the reviews. Their independence and concurrency is the point,
      and four consecutive sprints have had the quality reviewer catch something the spec reviewer
      did not.
  - id: RC-2
    raised: 2026-08-04 (STORY-204 and STORY-203, consecutively)
    severity: >-
      THE HEADLINE PROCESS FINDING OF THE SPRINT. Not an incident -- a PATTERN, and by the skill's
      own ratchet-brake rule a pattern is evidence the RULE IS AT THE WRONG RUNG.
    title: >-
      CONSTRAINT C3 ("the catalogue moves in the SAME COMMIT as the code it describes") FAILED IN
      TWO CONSECUTIVE STORIES DESPITE BEING PROMINENT IN EVERY BRIEF. It is prose. It must become
      a mechanism.
    what_happened: >-
      STORY-204: code in d38334b, zone-rules.md not until 22895b0 -- two commits during which the
      catalogue called ZR-8 Finding 2 a live violation that the tree had already fixed.
      STORY-203: code in e9cb8c8/691227f/db949c8, zone-rules.md not until 3ab9c9b. The spec reviewer
      PROVED the consequence instead of asserting it -- it checked out zone-rules.md at 1c07def and
      found it still reading "A genuine, adjudicated violation ... harness.py:753-757 ... hardcodes
      the literal table-name values ... now filed solely to STORY-203 (not fixed here)", asserting a
      live violation the SAME TREE had already fixed. At least two committed states carried it.
      NEITHER was a wrong final state. Both were commit SEQUENCING, and both are now permanent and
      flagged for PO adjudication, because rewriting history to manufacture compliance was refused
      (the SHAs are cited in six review reports, and squashing would destroy the TDD commit cadence
      that is the crash-recovery mechanism -- see STORY-203's status note for why that cadence is
      not negotiable this sprint).
    why_prose_cannot_hold_it: >-
      C3 was in the sprint constraints, in plan.md, in the board, and stated PROMINENTLY IN EVERY
      IMPLEMENTER BRIEF the orchestrator wrote -- including, for STORY-203, an explicit "STORY-204
      missed this and the miss is permanent; do not repeat it". It was still missed. Under working
      agreement A15 §2 and the skill's ratchet brake, a rule that existed and went unfollowed must
      be RELOCATED to a rung that holds, never restated more emphatically. Writing it in a sixth
      place is the one response the process forbids.
    the_rung: >-
      THE SCRIPT RUNG, and the mechanism ALREADY EXISTS -- which matters, because A14's mid-sprint
      tooling freeze does NOT block landing an already-decided lesson at an already-present
      mechanism. `yt_wiki.py` already computes staleness as pure git arithmetic
      (`git diff <verified_sha>..HEAD -- <code_refs>`). What is missing is only that it runs at HEAD.
      PROPOSED: a `--range <base>..<head>` mode that walks each commit in a story's range and
      asserts the sweep is CLEAN AT EVERY COMMIT, not merely at the tip. That is exactly C3,
      expressed mechanically, and it would have gone RED on both stories at the offending commit.
      Then make it a reviewer-run command or a DoD gate entry so it cannot be skipped by attention.
      SIZE IT HONESTLY AT THE RETRO: this is real new code in yt_wiki.py, so under A14 it is
      plausibly a STORY rather than an in-sprint ladder edit. Do not let that judgement become a
      reason to take prose again -- that exact move is what the ratchet brake was written to stop,
      and this repo already has a six-amendment family stating one idea because of it.
    do_not: >-
      Do NOT respond by adding a seventh restatement of C3, and do NOT respond by relaxing C3 --
      the rule is correct and the defect it prevents (documents made false by the commit that wrote
      them) was TEN of sprint 67's ELEVEN blocking findings.
    third_occurrence: >-
      *** C3 FAILED A THIRD TIME, IN STORY-215, AND THIS ONE IS WORSE THAN THE FIRST TWO. ***
      Found by the ORCHESTRATOR pre-review, not by a reviewer, and verified by printing the cited
      lines rather than reading around them.
      STORY-215's commit 935cd70 added DYNATRACE_* imports to env_matrix.py and harness.py, which
      falsified the STORY-202-era ZR-3 Fact at zone-rules.md:296-312 -- it claims env_matrix.py
      "imports all SEVEN" (now NINE) and harness.py "imports only the FOUR" (now FIVE), and its six
      cited re-type line numbers now point at a `print(`, an f-string fragment, two comments, a
      blank line and an assignment.
      WHY IT IS WORSE: STORY-204's and STORY-203's misses were SEQUENCING with a CORRECT END STATE.
      THIS ONE LEFT THE WIKI FALSE AT HEAD. A correct new History entry was added in 7fb87fe, which
      is not the same as repairing a Fact the same story broke.
      *** AND IT DEFEATED THE TOOL, WHICH IS THE PART THAT MATTERS FOR RC-2's DESIGN. *** The
      implementer bumped zone-rules.md's verified_sha to b887883, so yt_wiki.py's git arithmetic had
      nothing behind and reported `sweep: CLEAN` OVER A FALSE FACT. A verified_sha bump is a CLAIM
      ABOUT WHAT A HUMAN-OR-AGENT RE-READ, and no sweep can check it -- the same defect class as
      STORY-204's MAJOR 2. That Fact had ALREADY been bitten by this exact shape once before and
      says so in its own text ("NOT the story's own AC8 numbers ... which were the PRE-edit numbers
      AC8 itself warned would shift").
      CONSEQUENCE FOR RC-2's PROPOSED MECHANISM -- do not skip this at the retro: a per-commit
      `yt_wiki --range` sweep would NOT have caught this either, because the article was never
      STALE by git arithmetic once the sha was bumped. So RC-2's script must also address the
      DISHONEST-STAMP path, e.g. by refusing to accept a verified_sha bump in a commit that touches
      the article's own code_refs without touching the Facts that cite them, or by recording WHICH
      Facts were re-read. Sizing this honestly is retro work; the point here is that the obvious
      mechanism is necessary but NOT sufficient.
    fourth_occurrence: >-
      *** CORRECTION: THE COUNT IS FOUR, NOT THREE -- AND THE FOURTH IS THE ONE THAT SHOULD DRIVE
      THE DESIGN. *** Found by STORY-215's QUALITY REVIEWER inside the very bullet written to
      document the third occurrence, and verified independently by the orchestrator before being
      recorded here. Everything above this field was written believing the count was three; it is
      corrected rather than rewritten, because the sequence is itself the evidence.
      WHAT WAS WRONG: the fix-round bullet said 935cd70's import insertion shifted the six harness.py
      citations by +1. The real shift is +2, and HALF OF IT PREDATES STORY-215 ENTIRELY. Verified:
        git show 1d43b1b:tools/demo_loop_gate/harness.py | sed -n '546p'
          -> f"API (uvicorn) subprocess launched, pid={api_proc.pid}, "     <- NOT the cited site
      So those six citations were ALREADY FALSE at STORY-203's own fix-round commit 1d43b1b.
      STORY-203's import-block edit falsified them, and STORY-203 STAMPED verified_sha OVER THEM.
      WHY THIS FOURTH CASE IS THE IMPORTANT ONE: STORY-203 never touched the cited CONTENT. It added
      an import line elsewhere in harness.py, which shifted the lines underneath it. The Facts became
      false through PURE LINE DISPLACEMENT by an unrelated edit in the same file -- and the stamp
      then certified them. No reviewer caught it at the time; it surfaced two stories later, only
      because a reviewer checked the arithmetic in a bullet about a different defect.
      SO THE TWO FAILURE PATHS ARE NOT "SEQUENCING" AND "DISHONEST STAMP" -- THEY ARE:
        (i) prose not landing with the code that falsified it (STORY-204, STORY-203 AC7), and
        (ii) A STAMP CERTIFYING FACTS THE STAMPER DID NOT RE-READ -- which has now happened at least
             TWICE (STORY-203's 1d43b1b, STORY-215's 7fb87fe) and which NO git-arithmetic check can
             detect, because in both cases the article was legitimately stale, legitimately touched,
             and legitimately re-stamped. The arithmetic was right. The claim was false.
      DESIGN CONSEQUENCE, and it is sharper than the `--range` proposal above: line-number citations
      into files that other stories edit are STRUCTURALLY fragile, and `verified_sha` is a
      human-or-agent CLAIM that no sweep can audit. The retro should weigh (a) a citation checker
      that RESOLVES each `file:line` against the file and fails when it lands on a blank line, a
      comment, or a non-matching construct -- `tools/citation_sweep.py` ALREADY EXISTS and reports
      27 failures today, up from a recorded 11, so the capability is present and unenforced -- and
      (b) requiring a stamp to name which Facts were re-read. (a) would have caught ALL FOUR
      occurrences; the `--range` sweep would have caught only the first two.
    fifth_occurrence: >-
      *** FIVE. AND THIS ONE SETTLES THE MECHANISM QUESTION, because NO STALENESS SWEEP COULD EVER
      HAVE CAUGHT IT -- not the current one, not the proposed `--range` one. ***
      Found by the ORCHESTRATOR while resolving zone-rules.md's honest STALE state as part of the
      sprint-end wiki compile pass -- i.e. found by doing the ceremony, not by a reviewer.
      TWO citations claim `scripts/seed_topology.py:44` is
      `sum(len(app.signals) for app in config.apps)`:
        backend/src/composition/config.py:316   <- A SOURCE-CODE DOCSTRING, not a wiki file
        docs/scrum/wiki/config-layer.md:264     <- a Fact, in an article stamped `verified` at b272c32
      VERIFIED HISTORY:
        5c72bf6 -> line 44   (citation was CORRECT)
        e605cf1 -> line 47   (STORY-215's OWN AC4 commit b887883 removed `import os` and the
                              os.environ.get line, shifting it +3 and falsifying both citations)
        HEAD    -> line 48   (the second fix round's comment reword added one more)
      At HEAD, `:44` is a BLANK LINE.
      *** WHY NO SWEEP CAN SEE IT: `scripts/seed_topology.py` IS NOT IN config-layer.md's
      `code_refs`. *** Verified. So yt_wiki.py's git arithmetic has nothing to compare and will
      never flag that article however wrong the citation becomes -- staleness detection is
      STRUCTURALLY blind to a citation that points OUTSIDE the citing article's own code_refs. And
      config.py:316 is a SOURCE DOCSTRING, which no wiki tooling covers at all.
      THIS IS DECISIVE FOR THE RETRO. The five occurrences split:
        (i)   STORY-204 AC7 -- prose not landing with its code        -> `--range` catches
        (ii)  STORY-203 AC7 -- same                                    -> `--range` catches
        (iii) STORY-215/7fb87fe -- stamp over a Fact not re-read       -> `--range` MISSES
        (iv)  STORY-203/1d43b1b -- stamp over line-displaced Facts     -> `--range` MISSES
        (v)   this one -- citation outside the citing article's        -> `--range` MISSES, and so
              code_refs, plus a source-file docstring                     does EVERY staleness check
      ONLY CITATION RESOLUTION CATCHES ALL FIVE. `tools/citation_sweep.py` ALREADY EXISTS, already
      resolves citations, and already reports 27 failures against a recorded 11 -- the capability is
      PRESENT AND UNENFORCED. The retro's cheapest correct move is very likely to WIRE THE EXISTING
      TOOL INTO THE GATE, not to write a new one. Size the 27 pre-existing failures as their own
      story; do not let that backlog become the reason to keep taking prose.

