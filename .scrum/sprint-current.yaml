atomicity_rule: >-
  *** STORY-155a AND STORY-155b ARE ATOMIC: BOTH LAND, OR NEITHER DOES. *** A half-removed feature is
  exactly what equilibrium test 2 ("nothing is half-landed") forbids. If the window closes mid-155b,
  PAUSE WITH A COMMITTED HANDOFF rather than closing the sprint with 155a done and 155b outstanding.
  If 155b proves undeliverable, 155a's commits stay unmerged with it. The declared drop unit is THE
  PAIR, never one half. STORY-147 is NOT part of that unit -- it is independent and banked first.

execution_order: >-
  147 -> 155a -> 155b. 147 first by PO ruling and because it is independent. 155a before 155b is NOT
  the "SPA would 404" reason given at planning -- verification refuted that (the SPA degrades
  gracefully). The surviving reason: 155a's diff STALES sample-mode.md and 155b ARCHIVES it, so
  consumer-first archives the article ONCE instead of updating-then-archiving.

session_limit_discipline: >-
  *** PO INSTRUCTION AT LOCK: "be aware of session limits". *** A21's hook blocks a dispatch at >=95%,
  but the hook is a backstop, not a plan. RUN THE WINDOW CHECK AT EVERY AGENT BOUNDARY -- the reviewer
  pair counts as ONE boundary since they run concurrently. 5h <85 dispatch freely | 85-94 finish work
  already in flight on the CURRENT story but start no new story | >=95 park until resets_at and resume
  from the board. 7d >=90 -> tell the PO; a 7-day reset cannot be waited out inside a session.
  AT LOCK: 74%, resets 00:40. Enough for STORY-147's implementer and NOT obviously enough for the
  review pair after it -- RE-CHECK AT THAT BOUNDARY.

