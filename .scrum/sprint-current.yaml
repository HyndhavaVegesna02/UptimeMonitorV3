# ── Provenance ────────────────────────────────────────────────────────────────
# This sprint follows the PO's rejection of the sprint-59/60/61 operator cockpit
# ("i dont like this ui also", 2026-07-28) and the sprint-61 abort
# (docs/scrum/sprints/2026-07-22-sprint-61/aborted.md, keep-all-unmerged).
# Planning artefacts, all in docs/scrum/sprints/2026-07-28-sprint-62/:
#   ui-backend-gap-analysis.md     — the new reference UI vs the api/v1 surface; PO decisions §3a
#   config-shape-proposal.yaml     — the nested authoring shape (PO: "this shape looks good")
#   calculations-under-new-config.md — full calculation walkthrough + the two defects it surfaces
#   decisions-and-future-work.md   — D1-D4 decided, F1-F3 future work
#   program-roadmap.md             — option (a) split across sprints per PO pacing directive
#   plan.md                        — this sprint's contracts, steps, reality gates
# ── Scope discipline ──────────────────────────────────────────────────────────
# PO approved scope option (a) (~21 pts) but directed "do it multi sprint, with carefull
# verification, no need to rush in single stretch" — so it is SPLIT. This sprint is 10 pts,
# at the ~9-11 baseline. Frontend lands sprint 63+ (design system + shell first, with a PO
# look-and-feel checkpoint BEFORE six pages are built on the language — the pilot fix for the
# process failure behind three rejections).
# Post-verifier scope changes (2026-07-28, both MINE not the verifier's, both flagged for PO
# pushback in plan.md): STORY-148 SPLIT into 148 (wire contract, 3) + STORY-176 (scenario
# player + demo fleet + loop run, 3) after being assessed at 7-8 pts as one story; STORY-147
# DEFERRED to sprint 63 where its consuming frontend lands (purely decorative until then, and
# it now depends on the ConfigError hierarchy STORY-146 introduces). Total scope unchanged.
# EXPLICITLY OUT: all frontend work; STORY-147 (deferred to 63), STORY-150 (breadth model
# D1/D2), STORY-151 (per-component decision rollup), STORY-152 (expected-locations
# completeness), STORY-153 (rejection suppression F1), STORY-154 (map real failure codes —
# BLOCKED on trial renewal), STORY-155 (sample_mode removal), STORY-173 (leaked-container
# fixture fix).
# ── Live-data caveat ──────────────────────────────────────────────────────────
# The Dynatrace trial expired 2026-07-28: no observations arrive, nothing is reality-gateable
# against real vendor data, and sample_mode (which flips already-normalized rows) is inert.
# STORY-148 + STORY-176 exist to replace that. 148's reality gate is therefore a WIRE-SHAPE
# comparison against real captured fixtures (backend/tests/fixtures/dynatrace/
# grail_synthetic_events.json) plus a round trip through the REAL make_grail_executor over real
# HTTP — not "the loop didn't crash". Every failure-state row rests on ASSUMED vendor codes —
# map_synthetic_status maps only "0"/"HEALTHY" and raises otherwise
# (adapters/inbound/dynatrace/health_mapping.py:65-70). That limit is stated in the evidence,
# never absorbed as "the failure path is tested".
# ── Safety precondition (non-negotiable) ──────────────────────────────────────
# decide publishes RECOVERIES WITH NO HUMAN GATE (core/services/decide.py:122-126). A demo run
# wired to the real publisher would post fake statuses to the LIVE public Statuspage.
# The verifier found the original stub-based guard UNIMPLEMENTABLE (no publisher injection point
# in run.py:121-128 under a no-backend/src-changes constraint) and the exposure LARGER than
# described: run.py:178 load_dotenv() walks up from the source file, so the existing repo-root
# .env supplies Statuspage creds from any CWD, and a SECOND route exists via the API approve
# trigger (composition/app.py:160-182). STORY-176 AC3 replaces it with a CONFIG-ONLY guard:
# no statuspage_component_id anywhere in the demo config => statuspage_mapping() == {} =>
# publish_helper.py:211 falls through to LoggingPublisher on BOTH roots, even with real creds
# present. NO demo loop is started before that AC passes.
# ── Baseline ──────────────────────────────────────────────────────────────────
# First full-gate attempt on this branch was RED: `npm run build` exit 1. Diagnosed as
# ENVIRONMENT staleness, not a code defect — the on-disk frontend/node_modules was left from
# the sprint-59+ line (@fontsource/inter) while main's frontend declares @fontsource/geist +
# geist-mono, so the @import could not resolve. `npm install` restored it (021c9b6 records the
# 23 additive optional platform transitives; no real dependency version changed). Full-gate
# evidence recorded below at lock.
