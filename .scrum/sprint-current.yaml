      warning that anything was skipped. *** The inverse is equally live: an orchestrator's
      uncommitted `.scrum/` edit now reds any agent's gate for a reason unrelated to that agent's
      code -- and A20 exists precisely because the orchestrator edits those files continuously,
      INCLUDING while an agent runs.
      BOTH HORNS NAMED BY THE REVIEWER: narrowing _ORCHESTRATOR_OWNED_PREFIXES restores soundness
      but re-creates the exit-3 box A20 was written to remove. Two in-repo comments now assert the
