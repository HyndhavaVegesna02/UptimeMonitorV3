    GREEN at a360e50, measured during plan verification (not asserted): pytest 743 passed / 0 SKIPPED
    (65.9s), import-linter 9 kept / 0 broken, ruff check clean, ruff format --check 254 files already
    formatted. Frontend 3 + cfn-lint not run at planning; the full 8/8 at the final HEAD is the
    evidence of record.
  required_env: >-
    DYNAMO_ENDPOINT_URL=http://127.0.0.1:8021 and REQUIRE_DYNAMO=1 on EVERY gate run. Container
    uptime_dynamo_8021 was up 7h at lock. A wrong endpoint under REQUIRE_DYNAMO=1 ERRORS rather than
