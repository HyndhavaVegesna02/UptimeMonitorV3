        THREE minors NOT fixed: (1) config.py:780 builds raw_components_by_id on EVERY successful
        load but reads it only on the error path -- a next(...) at the raise site would confine the
        work to the failure it serves; (2) config.py:781's isinstance(c, dict) filter can never fire
        (a non-dict entry dies at ComponentConfig(**c)); (3) twelve lines of comment for a three-line
        comprehension, most of it restated in the docstring and both wiki articles.

