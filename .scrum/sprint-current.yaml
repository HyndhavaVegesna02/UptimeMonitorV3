  - id: STORY-187
    title: An import-provenance helper so a proof can prove WHICH code it ran
    file: docs/scrum/stories/STORY-187-import-provenance-helper-for-proofs.md
    status: todo
    points: 1
    ceremony: 1-2-pointer    # implementer -> DoD gate -> reality gate (no reviewer pair)
    order: 1                 # FIRST, and not for size reasons: stories 2-4 each owe a
                             # discrimination proof, and this is the tool that keeps one honest.
                             # It is also the mechanical rung that A1, A1's 2026-07-29 refinement
                             # and A3 each declined to take, proposed at TWO consecutive retros; the
                             # sprint-63 retro recorded that a third slip would itself be the
                             # finding, so it was filed instead of proposed again.
    plan_note: "VERIFICATION CORRECTED THE MECHANISM, and the correction makes AC3 EASIER. The
      story (and the first plan draft) say the trap is 'setuptools' finder'. It is not: there is no
      MetaPathFinder here. .venv/Lib/site-packages/__editable__.uptime_monitor_v3-0.1.0.pth contains
      exactly one line, `C:\\Hyn\\uptime_monitor_v3\\backend`, i.e. a plain absolute sys.path entry
      (pyproject.toml:23 package-dir = {\"\": \"backend\"}). A sys.path-ordering test therefore
      REPRODUCES the real mechanism rather than approximating it, so AC3's labelled-simulation
      allowance is nearly literal — the docstring label must say '.pth sys.path entry', not 'finder
      ordering'. Verifier probe from a foreign cwd resolved src.composition.vendor_health to
      C:\\Hyn\\uptime_monitor_v3\\backend\\src\\composition\\vendor_health.py with sys.path[0]==''."
    reality_gate_spec: "REWRITTEN after verification (finding B8). The first draft — 'a module
      inside the root passes, one outside raises' — is satisfiable with any stdlib module as the
      negative side, which proves Path.is_relative_to works, NOT that the trap is caught. Since
      every other gate this sprint delegates its provenance check to this helper, a weak gate here
      propagates. The negative side must build a second root holding a same-named module, append the
      wrong root to sys.path the way the .pth does, set expected_root to the other, and FIRST assert
      that a plain import really resolved to the wrong root — so the trap is live in the proof, not
      simulated only in the helper's arithmetic. Both sides recorded; verdict states how they
      differed (A3)."
