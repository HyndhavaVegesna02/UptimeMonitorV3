    ac4_risk_check: "AC4 changed `self.server.results.get(token)` to `.pop(token, None)`
      (`server.py:117-124`), i.e. a token is now CONSUMED by its first poll. That is a
      wire-protocol behaviour change, so it was checked against the real client rather than
      accepted from the story text: `grail_executor.py:100-137` polls in a loop but RETURNS at the
      first `state == \"SUCCEEDED\"` (`:127-128`), and the demo engine resolves every query
      synchronously server-side, so it always answers SUCCEEDED on poll 1. A second poll of the
      same token therefore never happens on the real path and AC7 holds. Residual, recorded
      because STORY-176 makes the engine long-running: a client that re-polls a token after a
      transient read timeout would now get 404 -> GrailQueryError instead of its rows. The real
      executor has no such retry (`:110-111` raises), so this is unreachable today — but it is a
      real narrowing of the protocol, not a pure leak fix."
