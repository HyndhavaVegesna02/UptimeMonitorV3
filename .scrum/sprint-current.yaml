stories:
  - id: STORY-188
    title: Normalize the .scrum/checklists encoding — they are a live corruption landmine
    file: docs/scrum/stories/STORY-188-normalize-checklist-encoding.md
    status: in_progress   # repair + guard landed; DoD gate pending at the commit
    points: 1
    ceremony: orchestrator   # NOT the external path: this writes .scrum/ state, which only the
                             # orchestrator may do. DoD gate + a byte-level verification.
    result: >-
      ALL .scrum/ FILES NOW CLEAN (0 invalid bytes, 0 U+FFFD), verified byte-level.
      TWO CORRECTIONS DURING EXECUTION, both recorded on the story file rather than tidied away:
      (1) THE PLANNING FIGURE OF 13 SITES WAS WRONG -- IT DOUBLE-COUNTED. It came from decoding each
          file with errors="replace" and counting U+FFFD, but that decode CONVERTS EVERY INVALID BYTE
          INTO A U+FFFD, so the "existing FFFD" column silently re-counted the invalid bytes already
          tallied in the other column. plan-verification.md reported 2 invalid AND 2 FFFD;
          quality-review.md 3 and 3 -- identical numbers, which was the tell. Only implementer.md's 3
          were genuine (it had no invalid bytes to manufacture them). The repair script's own != 13
          assertion CAUGHT THIS and exited non-zero instead of reporting success. NOTE: the
          plan-verifier "independently reproduced" the bad table, almost certainly by repeating the
          same errors="replace" method -- reproducing a measurement is not validating its method.
      (2) THE DEFECT WAS NEVER CONFINED TO .scrum/checklists/. Scanning all of .scrum/ while building
          AC6's guard found TWO MORE corrupted files nobody had measured: backlog.yaml (2) and --
          worse -- working-agreements.md (2), the retro-landed PROCESS RULES loaded every session.
          Losing a character there silently loses part of a RULE. Both repaired under this story:
          same defect class, same fix; shipping a guard over .scrum/ while knowingly leaving two
          files inside it corrupt would be theatre.
      FINAL: 12 sites / 5 files (5 invalid 0x97 + 7 genuine U+FFFD), all -> U+2014.
      Repair was BYTE-PRECISE: only bytes the UTF-8 validity scanner flagged were replaced, so a 0x97
      appearing as a legitimate CONTINUATION byte (e.g. U+2017 = E2 80 97) was copied through
      untouched -- a naive bytes.replace would have corrupted those.
      AC6 GUARD LANDED at .claude/skills/yourteam/scripts/tests/test_scrum_encoding.py (the
      yt_selftest rung, project-generic, skips cleanly when there is no .scrum/). yt_selftest now
      30/30 (was 28/28). SHOWN FAILING TWICE, INDEPENDENTLY: probe A injected a raw 0x97 -> FAIL
      test_scrum_files_are_valid_utf8, exit 1; probe B injected a U+FFFD into an otherwise perfectly
      valid UTF-8 file -> FAIL test_scrum_files_contain_no_replacement_characters, exit 1. PROBE B IS
      THE ONE THAT MATTERS: it proves the two checks are NOT redundant, since a file can be valid
      UTF-8 and still be full of already-destroyed characters. Both probes removed; 30/30 restored.
      AC5 RETIRED THE WORKAROUND: the sprint-64 "edit these files byte-safely via latin-1"
      instruction is obsolete and has been removed from this board and the session lock.
    order: 1                 # FIRST, and not for size reasons: until it lands, every dispatch that
                             # reads a checklist carries the corruption risk that ALREADY FIRED ONCE
                             # during STORY-187 (caught only by a pre-commit git diff read).
    plan_note: >-
      FINAL MEASURED DAMAGE -- 12 sites / 5 files (the planning figure of 13 was a double-count; see
      `result`). All are ONE CHARACTER: 0x97 is cp1252 EM DASH, and every genuine U+FFFD is an
      em-dash already destroyed by a lossy round-trip, so all 12 become U+2014 -- reconstruction is
      CERTAIN, not guesswork.
        .scrum/checklists/implementer.md        0 invalid, 3 genuine U+FFFD
        .scrum/checklists/plan-verification.md  2 invalid (0x97 @3492,3640), 0   <-- retro MISSED it
        .scrum/checklists/quality-review.md     3 invalid (0x97 @2833,2883,3007), 0
        .scrum/checklists/spec-review.md        clean
        .scrum/backlog.yaml                     0 invalid, 2 genuine U+FFFD      <-- nobody measured
        .scrum/working-agreements.md            0 invalid, 2 genuine U+FFFD      <-- nobody measured
      TEMPLATES ARE CLEAN (all four under .claude/skills/yourteam/templates/checklists/ valid UTF-8,
      zero U+FFFD), so the corruption is POST-GENERATION, in the instances. yt_selftest was 28/28
      green WITH the corruption present, so parity is not byte-comparing this content -- AC4 asserted
      that rather than assuming it. No backend DoD command reads .scrum/ (verified), which is exactly
      why this rotted unseen and why AC6 adds the missing mechanical rung.
      AC6 PLACEMENT: the guard landed in yt_selftest, NOT backend/tests/ -- a backend test reading
      .scrum/ would create a new repo-layout coupling, and the skill rung must stay PROJECT-GENERIC
      (PO directive 2026-07-13).
      THE SPRINT-64 "EDIT THESE FILES BYTE-SAFELY (latin-1)" WORKAROUND IS RETIRED (AC5) -- the
      defect it guarded against is fixed and a mechanical guard now prevents its return.

  - id: STORY-190
    title: One unmappable row stalls a signal forever — quarantine the row, keep the batch
    file: docs/scrum/stories/STORY-190-partial-batch-resilience.md
    status: todo
    points: 3
    ceremony: external + spec + quality + gate    # external mode: BOTH reviewers regardless of size
    order: 2                 # BEFORE STORY-177: fix the poison before adding row variety. Also the
                             # widest blast radius (it changes the fetch_observations contract), so
                             # if it goes sideways the mapping still ships.
    plan_note: >-
      THE DEFECT IS WORSE THAN STORY-177 DESCRIBED IT, and the plan-verifier could NOT refute the
      correction after four separate attempts. normalize_rows (dispatch.py:80) is a bare list
      comprehension; it runs inside fetch_observations (adapter.py:44), called at pull_loop.py:102
      BEFORE ingest_observations at :109, so _watermark_repo.advance (ingest_service.py:139) is NEVER
      REACHED. run_periodic catches/logs/continues (:200-207, by design per STORY-050) and the next
      cycle re-queries the SAME window with the SAME bad row. => NOT "one batch lost": THAT SIGNAL
      NEVER ADVANCES AGAIN while the loop looks alive.
      VERIFIER STRENGTHENED IT: advance() at ingest_service.py:139 is the ONLY watermark writer in
      all of backend/src/ and tools/ (exhaustive grep); build_dql_query (query.py:91-99) adds ONLY a
      lower bound -- no upper bound, no limit -- so the poison row is in-window forever; the demo
      store never evicts (store.py:29-30); and `sort timestamp asc` (query.py:102) means the EARLIEST
      bad row aborts, discarding already-normalized EARLIER rows too.
      NAMES ARE PRESCRIBED (external mode -- an unnamed type is a coin flip): RowNormalizationFailure
      (row: dict, reason: str), NormalizationOutcome (observations, failures), and
      normalize_rows_lenient(rows, *, signal_key) -> NormalizationOutcome. normalize_rows itself stays
      BYTE-FOR-BYTE UNCHANGED and strict (AC7; 8 test call sites + adapter.py:44, verified complete).
      *** THE STEP MOST LIKELY TO BE GOT WRONG: build_live_loop calls run_periodic
      (run.py:137-150), NEVER run_cycle. BOTH run_cycle AND run_periodic must gain
      rejected_repo, and run_periodic must pass it through at its run_cycle call site
      (pull_loop.py:186-199). Adding it only to run_cycle wires NOTHING in production while every
      test passes. ***
      run_cycle's return type and on_cycle's type (pull_loop.py:82, :147-150) are UNCHANGED -- do not
      widen them. See C1 for the zone trap; this is the story it targets.
    reality_gate_spec: >-
      AC2 and AC3 are the teeth. AC2 requires proving the WATERMARK ADVANCED across two consecutive
      cycles -- a test that only checks "good rows survived" does NOT satisfy it, because the
      PERMANENT STALL is the defect. AC3 requires the stall REPRODUCED FAILING on the pre-fix state
      (C2/A7): shown failing, then shown passing.

