      clean GREEN run above stopped the idle :55432 leftover first and passed 570/570.
      RETRO: STORY-080 + skip/serialize dev_db-lifecycle tests when an external dev_db is up."
  - artifact: "import-linter (cmd 2) crashes on Windows WITHOUT PYTHONUTF8=1: rich's Unicode banner
      breaks the cp1252 pipe writer (UnicodeEncodeError in rich/_win32_console.py). Benign — under
