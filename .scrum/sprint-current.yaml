  (collapsible icon sidebar, Geist type, expanded 7-status palette, cards/grids/timeline),
  binding every element to REAL API data (no fakes) while preserving all functionality,
  routing, and business logic. Backend data gaps are filed as follow-up stories (063-067),
  not built here."
