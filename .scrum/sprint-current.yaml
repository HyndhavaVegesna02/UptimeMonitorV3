# YourTeam active sprint board. No active sprint when status: none.
sprint: 67
status: active     # none | planning | active | review | closed | aborted
                   # LOCKED 2026-08-02. SCOPE IS FROZEN -- new PO requests go to the backlog, not
                   # into this sprint. Tooling is frozen too, EXCEPT the enforcement ladder (A14).
                   # THREE PO RULINGS AT PLANNING (2026-08-02), all recorded because they shape
                   # how the sprint runs:
                   #   1. SPRINT APPROVED AS SCOPED -- 11 points, all five stories, in-process.
                   #      The PO did NOT take either of the offered reductions (drop 201, or drop
                   #      201+202), so the drop order in sizing_note applies only if the SESSION
                   #      runs short, not as a standing trim.
                   #   2. THE DoD CHANGE IS APPROVED. STORY-210 AC1 may change
                   #      .scrum/definition-of-done.md: `ruff check .` -> `python -m ruff check .`
                   #      and `ruff format --check .` -> `python -m ruff format --check .`.
                   #      Same checks, same rules, same files -- only the entry point moves. This
                   #      is PREVENTIVE: ruff.exe is NOT blocked today (measured at planning), and
                   #      `python -m ruff` was verified equivalent (both report ruff 0.15.20).
                   #      C3 is therefore SATISFIED -- the story may make the edit. Every other
                   #      statement of those commands must move in the SAME commit (AC2).
                   #   3. SUBAGENTS ARE APPROVED for the full ceremony. yt-implementer per story,
                   #      then yt-spec-reviewer || yt-quality-reviewer concurrently. This restores
                   #      the ceremony sprints 62-66 ran on, and it matters more than usual here:
                   #      sprint 66's loudest finding was that BOTH reviewers found real defects in
                   #      EVERY story, several already personally accepted by the orchestrator,
                   #      for the third sprint running. The alternative on offer (orchestrator
                   #      implements and accepts its own work, with review_debt recorded) was NOT
                   #      taken. No story in this sprint should reach review unreviewed.
goal: >-
  Turn sprint 66's audit report into landed fixes. A report is a document; a document does not fix a
  production defect. Fix the highest-severity findings and drive both standing guards' exemption
  lists toward empty -- ZR-7 from five entries to zero, ZR-3 losing its two STORY-202 entries -- and
  harden the DoD gate against the policy that took it red mid-sprint. The success measure is
  mechanical because sprint 66 built it: every exemption entry names the story meant to remove it,
  and each guard's stale-exemption test goes RED if a fix lands without its entry being removed.
mode: in-process
branch: sprint-67  # CUT 2026-08-02 off sprint-66; sprint-66 STAYS UNMERGED (standing "don't merge
                   # with main" directive, re-confirmed at the sprint-64 review).
start_tag: sprint-67-start   # created at lock, points at 405ab09
start_commit: 405ab09
                   # NOTE ON THE TWO SHAs, so the baseline is not misread: the full 8/8 baseline
                   # gate was measured at 86459ea. 405ab09 is the planning commit on top of it
                   # (.scrum/ + docs/scrum/ only -- the sprint plan, the refined story files and the
                   # backlog status updates). `git diff 86459ea..405ab09` touches NO code under
                   # backend/, frontend/, tools/, config/ or infra/, so the gate result carries
                   # forward unchanged. Sprint diffs are measured from 405ab09.
baseline:
  tree: clean at 86459ea
  gate: >-
    FULL 8/8 GREEN at 86459ea, exit 0 (2026-08-02, this session): python -m pytest 689 passed /
    0 SKIPPED; 8 import contracts kept; ruff check + ruff format clean (247 files); cfn-lint clean;
    frontend npm test 363 passed in 51 files; npm run build and npm run lint clean.
  baseline_was_red_first: >-
    IMPORTANT AND WORTH THE RETRO'S TIME. The first baseline run was RED: `ruff format --check .`
    exited 1 on .claude/skills/yourteam/scripts/tests/test_backlog_story_parity.py -- the A11
    AMENDMENT'S OWN FILE, landed at the sprint-66 retro AFTER that sprint's final gate run (which
    recorded "246 files already formatted"), so the DoD gate never saw it. A single line-wrap;
    fixed at 86459ea before planning continued. A11 was routed to the SCRIPT rung precisely because
    a machine should check state parity -- and the file itself never went through the machine that
    checks code. A13, written in the SAME retro, is the rule that would have caught it.
  selftest: 35/35 OK, re-run this session after the backlog edits
  wiki: >-
    yt_wiki CLEAN on all four blocking checks (sweep, facts, links, integrity). 2 advisory `refs`
    amplifier notes (run.py and pyproject.toml each a code_ref in 5 articles) -- unchanged, never
    blocking.
  dynamo: container uptime_dynamo_8021 up on 127.0.0.1:8021, REQUIRE_DYNAMO=1 on every run
plan_verification:
  dispatched: true
  dispatched_late: true
  contract_sensitive: true
  reason: >-
    THIS SPRINT QUALIFIES ON TWO INDEPENDENT COUNTS -- STORY-200 changes a port contract consumed by
    an adapter AND a core service, and STORY-199 is scale-sensitive logic whose defect only appears
    past DynamoDB's 1MB page. At drafting it was NOT dispatched for an ENVIRONMENTAL reason (this
    session's standing constraint on spawning subagents), never because it was judged unnecessary --
    recorded that way deliberately so it would not read as a token-economy skip like sprint 66's.
  sequencing_deviation: >-
    THE PO LIFTED THE CONSTRAINT AT APPROVAL, so the verifier WAS dispatched -- but AFTER the PO
    approved the plan rather than before, which is not where the ceremony puts it. Recorded as a
    deviation rather than presented as compliance. It still ran BEFORE any implementer and before a
    line of code was written, which is where most of its value sits: anything it finds lands as an
    AC correction, not as rework. What it CANNOT do at this point is change what the PO agreed to --
    so any finding that would alter SCOPE (rather than sharpen an AC) goes back to the PO instead of
    being absorbed silently.
  self_probe_caught_before_approval: >-
    Recorded separately from the verifier's findings so the two are not conflated.
  self_probe_caught: >-
    THREE things, all before the lock, all folded into the stories. (V4) STORY-200's file asserted
    "STORY-198, already landed" -- FALSE at HEAD, where dynamo_proposal_repository.py:286 still
    reads `if action == "approved"`; so STORY-200 now SUBSUMES 198 instead of reconciling with it,
    and 198 is marked superseded. Running both would have edited the same three lines twice.
    (V6) STORY-202 was filed as "import seven names", but FIVE of them are function-body literals
    in settings.py:32-38 with no symbol to import -- the story must first promote them to module
    constants in backend/src/, which makes it touch production code and re-points it 1 -> 2.
    (V7) STORY-210's whole premise was stale: the acute failure was fixed during sprint 66 and the
    gate is green, so "BLOCKS EVERY FUTURE STORY" is no longer true. Rescoped to the exposure that
    genuinely remains, and re-titled.
  not_equivalent_to_review: >-
    Stated plainly because sprint 66's loudest finding was exactly this: self-review is weaker than
    an independent pass. The orchestrator's own probe caught three real problems, which is the same
    pattern as sprint 66's self-probe -- and sprint 66 then had reviewers find defects in EVERY
    story anyway, several already personally accepted.
constraints:
  C1_remove_dont_rekey: >-
    Every guard entry this sprint retires must be REMOVED, not re-keyed. ZR-7's and ZR-3's entries
    are keyed by (file, line) and the fixes shift those lines, so the tempting move is to update the
    key. The correct action is deletion -- the violation is gone. Both guards' stale-exemption tests
    enforce it, which is why this is a constraint and not a hope.
  C2_shown_red: >-
    No fix lands without something going RED first. Every story here fixes a defect that green tests
    currently tolerate, so each carries a mutation or pre-fix proof (199 AC6, 200 AC7, 202 AC4,
    210 AC5). A fix whose removal turns nothing red is unpinned, whatever the coverage says.
  C3_dod_change_is_po: >-
    STORY-210 AC1 changes .scrum/definition-of-done.md and is a PO decision, not taken unilaterally
    -- mirroring how the sprint-66 change was handled.
  C4_classification_never_downgrades_a_red: >-
    STORY-210's policy-block detector LABELS, it does not excuse. A blocked command still exits
    nonzero and still fails the gate (AC4), and a test asserts it. Written down because
    "environmental" is precisely the word that could become a wave-through, and A12's motivating
    incident was a guard whose message invited an action its own check could not justify.
  C5_env: >-
    REQUIRE_DYNAMO=1, DYNAMO_ENDPOINT_URL=http://127.0.0.1:8021, Docker up. Record pass/skip COUNTS
    on every backend gate record; a nonzero skip count is an incomplete gate, not a pass.
    STORY-200's AC5 is meaningless without real DynamoDB -- its branch is invisible to the fake.
  C6_publish_guard: >-
    STORY-202 edits the mechanism that SELECTS config/demo, and that selection IS the publish guard
    (empty statuspage_mapping() -> LoggingPublisher). AC6 requires re-verifying it empirically
    rather than reasoning that it should be equivalent. `decide` publishes recoveries with NO human
    gate and sprint 65 proved that path fires.
stories:
  - id: STORY-210
    title: Harden the DoD gate against the Application Control policy — remaining exe shims + a policy-block diagnostic
    file: docs/scrum/stories/STORY-210-device-guard-blocks-dod-commands.md
    status: todo
    points: 2
    ceremony: implementer + both reviewers
    order: 1
    plan_note: >-
      FIRST because it protects every other story's gate run. RESCOPED AT PLANNING -- read the story
      file, not the filing: the acute failure is CLOSED (both invocations changed with PO approval
      in sprint 66; full gate green today). What remains is that the policy widened twice without
      warning and THREE of eight commands still run through shims. Measured today: ruff.exe is
      STILL ALLOWED, so AC1/AC2 are PREVENTIVE; `python -m ruff` is confirmed equivalent; npm has NO
      module form and that exposure is irreducible locally (AC7 requires saying so rather than
      claiming the gate is hardened). yt_gate.py has ZERO policy-block detection today, so AC3-AC5
      are genuinely new work at the SCRIPT rung -- exempt from the tooling freeze under A14, and it
      mechanises the first step of the 2026-07-06 agreement, which until now was prose applied from
      memory and worked in sprint 66 only because the orchestrator recognised the signature.
  - id: STORY-199
    title: Paginate the five adapters/persistence/ methods (across four files) that silently truncate against an "all" port contract
    file: docs/scrum/stories/STORY-199-paginate-persistence-list-methods.md
    status: todo
    points: 3
    ceremony: implementer + both reviewers
    order: 2
    plan_note: >-
      THE ONLY LIVE PRODUCTION DEFECT IN THE SET and the sprint's reason to exist -- NEVER dropped.
      is_under_maintenance silently returns False for a component that IS under maintenance once
      windows exceed one 1MB page, disabling maintenance suppression in `decide`. It does not raise.
      Four siblings share the shape; the correct pattern is in the SAME directory
      (dynamo_observation_repository.in_window, with a _limit hook at :23 that makes the page
      boundary reachable without a megabyte of fixtures). AC5 is the cheapest evidence in the
      sprint: ZR-7's _EXEMPTIONS must end EMPTY, and the guard's stale-exemption test goes RED on
      anything left behind -- sprint 66 wrote that guard to detect this story landing. NOTE for the
      implementer: is_under_maintenance answers a BOOLEAN, so it pages until the first match and
      returns True immediately; it must not become a collect-everything loop on the common
      not-under-maintenance path, which runs every cycle.
  - id: STORY-202
    title: env_matrix.py must import ALL SEVEN child env-var NAMES from settings.py, not re-declare them
    file: docs/scrum/stories/STORY-202-env-matrix-import-env-var-names.md
    status: todo
    points: 2
    ceremony: implementer + both reviewers
    order: 3
    plan_note: >-
      RE-POINTED 1 -> 2 at planning. The filing assumed seven names could simply be imported; FIVE
      are function-body literals at settings.py:32-38 with no symbol to import, so the story must
      first promote them to module constants -- which pulls it into backend/src/ and out of a pure
      tools/ change. CONFIG_DIR is the most severe of the seven, above the credential pair: fake
      credentials are defence in depth, whereas CONFIG_DIR selects config/demo and therefore empties
      statuspage_mapping() -- it IS the publish guard. Keep the KEY NAMES (this story) apart from
      the duplicated VALUES (STORY-203) or the two will collide. AC5 removes ZR-3's :75/:77
      adjudications and must NOT touch :39, which cites STORY-203.
  - id: STORY-200
    title: Give ProposalRepository.record_approval_event a domain-typed action parameter (subsumes STORY-198)
    file: docs/scrum/stories/STORY-200-proposal-port-domain-typed-action.md
    status: todo
    points: 3
    ceremony: implementer + both reviewers
    order: 4
    plan_note: >-
      SUBSUMES STORY-198, which had NOT landed despite the previous story file asserting it had --
      re-verified wrong at HEAD. Re-pointed 2 -> 3 for the absorbed scope and the real-DynamoDB
      proving test. THE DESIGN QUESTION IS SETTLED AT REFINEMENT, not left open: the port takes
      ProposalState, NOT a new 2-member enum, because the sibling method in the same port (resolve,
      :32) already takes ProposalState for the same two values, and a narrower type would need a
      mapping back to it -- a second declaration of the approved/rejected vocabulary, which is the
      exact duplication class this sprint removes. The expiry condition for that decision is
      recorded in the story file. AC5 IS THE ONE THAT MATTERS: fakes.py:175-183 does NOT denormalize
      approved_actor, so the fixed branch is INVISIBLE to the fake -- the proving test must run
      against DynamoDB Local, and a fake-based substitute would assert nothing while looking green.
      Blast radius is real: approved_actor is the SOLE source of Publication.author, so value drift
      silently blanks the author column for every row.
  - id: STORY-201
    title: Clickpath normalizer hygiene — use require_field for execution.outcome
    file: docs/scrum/stories/STORY-201-clickpath-require-field-hygiene.md
    status: todo
    points: 1
    ceremony: implementer + DoD gate (1-2 point ceremony)
    order: 5
    plan_note: >-
      FIRST TO DROP if the session runs short. One line, no dependencies, and the code path is
      UNREACHABLE today (clickpath is absent from _NORMALIZERS), so it is preventive hygiene. The
      story now carries an explicit SCOPE LIMIT: the quarantine-net claim cannot be demonstrated
      end-to-end because no clickpath row can reach normalize_rows_lenient -- it is an inference
      from MalformedDqlRowError being a ValueError subclass, and must be reported as an inference,
      not as "verified through the quarantine path".
sizing_note: >-
  11 points across 5 stories -- the top of the stated ~9-11 baseline, same size as sprint 66. The
  sprint-66 retro found that fix-round cost is driven by story KIND, not size: an audit sprint's
  deliverable is prose, which fails review in ways code does not. This sprint's deliverable is code
  with mechanical proofs, so 11 is a considered call rather than a stretch. DROP ORDER if the
  session runs short: STORY-201 first, then STORY-202. NEVER STORY-199 (the live defect) and never
  STORY-210 (it keeps the gate trustworthy for everything else).
ceremony_note: >-
  Four of five stories get BOTH reviewers, including two below the 3-point threshold, and that is
  deliberate. Sprint 66's evidence: both reviewers found real defects in EVERY story, several
  already accepted by the orchestrator, for the third sprint running. STORY-210 is 2 points but
  edits the DoD and the gate runner itself; STORY-202 is 2 points but touches the publish-guard
  mechanism. Only STORY-201 -- one line, unreachable code -- takes the small-story ceremony.
