constraints:
  C1_no_inline_fixes: >-
    STORY-195 and STORY-196 produce findings and FILED stories. Their diffs touch no file under
    backend/src/, frontend/ or config/. PO ruling, not preference: an audit that fixes as it goes
    yields one unreviewable mega-diff and no backlog.
  C2_re_derivable: >-
    Every count and every citation must be re-derivable by command. Reports record the command AND
    its output; reviewers re-run them. "I read the zone" is not evidence. This IS the sprint's
    reality gate (see plan.md) -- an audit has no running surface, so re-derivation replaces
    "exercise the live path".
  C3_guards_shown_red: >-
    A guard that has only ever been green is not a guard (A7 + A9). Every new contract or test is
    shown RED first -- against the real violation, or a deliberate mutation then reverted -- with
    command and output recorded. A9 makes this a spec-review VERDICT condition: cannot answer
    "would this go red if I broke the guarded behaviour?" => NOT_MET, never MET-with-a-note.
  C4_no_new_gate_command: >-
    A ninth DoD command changes definition-of-done.md's contract and needs its own PO decision.
    Guards ride inside the existing eight (a contract runs inside command 2, a test inside
    command 1). A rule guardable ONLY by a new command is filed, not smuggled in.
  C5_catalogue_is_normative: >-
    Findings cite ZR-n ids from the catalogue. A finding with no rule id is either a new rule
    (amend the catalogue in the same sprint and say so) or an opinion (drop it). Where a rule
    would contradict working-agreements.md, the PO-stated rule wins.
  C6_env: >-
    REQUIRE_DYNAMO=1, DYNAMO_ENDPOINT_URL=http://127.0.0.1:8021, Docker up. Record pass/skip
    COUNTS on every backend gate record; a nonzero skip count is an incomplete gate, not a pass.
stories:
  - id: STORY-194
    title: Zone-intent rule catalogue — write down the boundary rules the eight contracts cannot enforce
    file: docs/scrum/stories/STORY-194-zone-intent-rule-catalogue.md
    status: done
    points: 3
    ceremony: implementer + both reviewers (spec FAIL -> fix round -> orchestrator acceptance check)
    result: >-
      DONE at 3b0ff0f. Delivered docs/scrum/wiki/zone-rules.md -- FIVE rules, not the three the
      first draft had. ZR-1 inbound adapter must not hold/call a persistence port (GUARDABLE: an
      enumerated forbidden contract over the 9 repository/watermark port modules -- NOT all of
      core/ports, because core/ports/signal_ingest.py is the documented front door a driving
      adapter may legitimately name). ZR-2 vendor vocabulary confined to three closed PROSE FORMS
      inside core/, with the Provenance carve-out (GUARDABLE to a stated extent, residue named:
      string annotations and dynamically built identifiers stay invisible to a static AST walk).
      ZR-3 no re-declared constant across the tools/ -> backend/src/ one-way boundary (GUARDABLE
      by test only; lint-imports is structurally blind to tools/). ZR-4 the five-file api feature
      convention. ZR-5 composition-root config parity.
      REVIEW HISTORY, recorded because it is the story's real shape: spec review FAILED (AC5
      NOT_MET) and quality review returned FIX_REQUIRED with 5 MAJOR + 9 minor. Both were right
      and both found things the orchestrator had personally accepted -- the second sprint running
      that this has happened, which is the strongest standing argument for both reviewers on every
      story. The blocking defects were all in the two things the DOWNSTREAM stories consume: rule
      DECIDABILITY and the GUARDABLE sketches' implementability. Worst of them: ZR-1's original
      sketch would have banned all of src.core.ports, failing a shape the dossier documents; and
      ZR-2 keyed on an open-ended vendor word list ("...") that could not settle 6 real core/ lines
      or the Pydantic attribute-docstring idiom on nearly every domain field. ZR-2 was rebuilt to
      key on FORM instead of on words, which is what made it decidable.
      The implementer pushed BACK on three facts rather than complying (ZR-3's collision count is
      101 not the 105 quoted at hand-off; test_zone_layout.py spans 125-173 not -174; ZR-5 has no
      violating citation to give because both roots genuinely agree today) -- recorded as-is, since
      sprint 65's lesson was that reproducing a measurement is not validating it.
      ORCHESTRATOR CORRECTION AT ACCEPTANCE (3b0ff0f), a defect NEITHER reviewer could have caught
      because it emerged FROM the fix round: ZR-3's newly-pinned scope (module-level UPPER_CASE
      constants, both sides) EXCLUDED the very violation ZR-3 adjudicates -- a function-body literal
      in tools/demo_loop_gate/harness.py:746-750 duplicating a pydantic FIELD DEFAULT at
      backend/src/composition/settings.py:21-22. That is also why its narrow measurement returned 0
      while a real duplicate stood: the 0 was an artifact of the scope, NOT a clean tree. Scope
      widened to both declaration shapes plus tools/-side literals inside function bodies. *** THIS
      IS LOAD-BEARING FOR STORY-196 AC3: the sweep MUST find the harness.py case, so a STORY-196
      sweep reporting 0 while that case stands is a BROKEN SWEEP, not a clean tree. ***
      AC VERDICTS (AC1-AC6 all MET; AC1/AC6 mechanics and the article text re-verified by the
      orchestrator directly, not taken from the implementer's self-report): yt_wiki CLEAN on
      sweep/facts/links/integrity; verified_sha c0a4d71 short + real + empty diff over code_refs;
      diff over d4ad03e..HEAD touches NOTHING under backend/src/, frontend/ or config/ (C1 holds);
      5/5 backend gate PASS, 685 passed / 0 SKIPPED.
      KNOWN TRADE ACCEPTED: the article's code_refs widen backend/src/composition/run.py from a
      code_ref in 4 articles to 5, tripping an ADVISORY refs amplifier note. Accepted because ZR-5
      cannot cite the two composition roots without it, and refs never blocks. Worth a retro line.
    order: 1
    plan_note: >-
      THE YARDSTICK -- everything else depends on it, so it can never be dropped. A planning probe
      established that the CHEAP violations are absent (V2: no api->adapters import, no outward
      import from core, no inbound adapter holding a port) and that the SUBTLE shape is everywhere
      (V3: ~20 vendor mentions inside core/, every one in a docstring). No document in this repo
      says whether that is compliant, so two auditors could disagree and neither could be shown
      wrong. AC5 exists to kill ~20 false findings before STORY-195 reports them. AC1 was
      CORRECTED pre-lock against V4/V5 above.
  - id: STORY-195
    title: Audit the core and adapters zones against the rule catalogue
    file: docs/scrum/stories/STORY-195-audit-core-and-adapters.md
    status: done
    points: 3
    ceremony: implementer + both reviewers + fix round (fix round NOT independently re-reviewed -- see result)
    result: >-
      DONE at 2c29514, but read the caveat at the end before treating this as fully verified.
      Delivered docs/scrum/sprints/2026-07-31-sprint-66/audit-core-adapters.md -- all 58 modules
      (core 31 + adapters 27) enumerated and listed with a verdict; the spec reviewer independently
      re-ran the enumeration and confirmed the report's two tables match `find` name-for-name in
      BOTH directions, zero missing and zero extraneous. That part is solid.
      *** THE SPRINT'S REAL LESSON SO FAR, AND IT IS UNCOMFORTABLE: the audit's value came mostly
      from ADVERSARIALLY REVIEWING THE AUDIT, not from the audit. *** The first pass reported zero
      ZR-1..ZR-5 violations and 57 CLEAN verdicts. Spec review returned FAIL (AC2) and quality
      review FIX_REQUIRED with 4 MAJOR + 9 minor -- and THREE of those MAJORs came from the quality
      reviewer's own independent pass over ~46 of the 58 files, finding things INSIDE files the
      audit had already verdicted CLEAN. The 57 CLEAN verdicts were substantially a bulk assertion
      backed by three greps that only re-measured what planning had already measured.
      WHAT THE REVIEW FOUND THAT THE AUDIT DID NOT:
        1. A REAL PRODUCTION DEFECT THAT DOES NOT RAISE -- dynamo_maintenance_repository.py:90-97
           returns False for a component that IS under maintenance once the 1MB page is exceeded,
           silently disabling maintenance suppression in `decide`. Four siblings share the shape;
           the correct paginating pattern already exists in the same directory. Filed STORY-199 (3).
        2. GAP-1's ROOT CAUSE -- core/ports/proposal_repository.py:45 declares `action: str` while
           its sibling takes `to_state: ProposalState`. The adapter compares a literal BECAUSE the
           port hands it a string, so STORY-198's adapter-only fix leaves the boundary untouched.
           Filed STORY-200 (2). That file had been verdicted CLEAN.
        3. clickpath_normalizer.py:39 reads a field directly, so its KeyError escapes the
           quarantine net -- the stall shape STORY-190 closed. Unreachable today. Filed STORY-201 (1).
      TWO RULES ADDED TO THE CATALOGUE MID-AUDIT (C5 permits this, and requires saying so):
        ZR-6 a core-owned port expresses every parameter and return in domain types; a primitive
             standing in for an existing domain type is a boundary finding. (REPLACED the audit's
             draft ZR-6, which was general Python hygiene applying identically within one zone, with
             an undecidable escape clause -- the same defect that got ZR-2's first draft rewritten.)
        ZR-7 an adapter must satisfy the port contract it implements; silently truncating a result
             set the port promises in full is a boundary violation, not a storage detail.
      RE-DERIVABILITY DEFECT, the spec FAIL: the report's recorded vendor-word grep claimed "28
      lines" and did not reproduce -- 22 under its own pattern, 26 under a corrected one, and 4 of
