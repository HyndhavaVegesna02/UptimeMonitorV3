  - id: STORY-226
    title: ComponentConfig validation ergonomics
    points: 3
    order: 3
    status: todo
    file: docs/scrum/stories/STORY-226-component-field-validation-ergonomics.md
    ceremony: "implementer -> spec reviewer + quality reviewer (concurrent) -> gate -> reality gate"
    carry_into_brief: >-
      BOTH PO RULINGS ARE IN THE AC: the error shows the AUTHORED value AND the normalized one; an
      empty description normalizes to null AT LOAD.
      *** THE TRAP: the authored group is NOT available where the error is raised, because the field
      validator lowercases at CONSTRUCTION. The obvious fix -- move the check into the validator --
      is the EXACT failure STORY-147 documented twice: a ValueError subclass raised inside a pydantic
      validator becomes a ValidationError and LOSES ITS SUBCLASS. The check MUST stay in load_config,
      OUTSIDE the try/except. ***
      THE VERIFIED WAY THROUGH: `raw` is assigned at config.py:669-671 and is STILL IN SCOPE at the
      :755 raise site, so raw["components"] carries the authored group verbatim. JOIN ON comp.id
      (never normalized), not on list position.
      AC4 WAS REWRITTEN -- the draft was unsatisfiable-or-theatre. service.py:22-29 is an
      unconditional passthrough and the fake repo never invokes load_config, so AC3 is the guarantee
      and the API inherits it. DO NOT add a normalization step downstream to green a test.
      AC5: state the whitespace rule AS CODE. Recommended `None if not v.strip() else v` -- the
      alternative (`v.strip() or None`) moves the _MAX_DESCRIPTION_LENGTH boundary pinned at
      test_config.py:953.

