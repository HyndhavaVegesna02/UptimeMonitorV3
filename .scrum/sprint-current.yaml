# ---------------------------------------------------------------------------
# PRE-LOCK PLAN VERIFICATION -- yt-plan-verifier, verdict GAPS, 20 findings, ALL
# closed in the story files and plan.md BEFORE the PO saw the plan. Full narrative:
# plan.md "Plan verification". The two that would have cost real time:
#   F1  STORY-219's AC2 was a NO-OP. It claimed that enforcing only line-numbered
#       citations would quarantine citation_sweep.py's three documented
#       false-positive classes. CITATION_RE (:41-44) makes `:(\d+)` MANDATORY, so a
#       citation without a line number is never extracted at all -- 129 of 129
#       failures carry one. The filter removed NOTHING, and Risk 1 asserted it as
#       the mitigation. An implementer would have written it, measured no change,
#       and been redesigning the story mid-sprint against a locked estimate.
#       AC2 now filters on PATH RESOLVABILITY, which is what discriminates: 124 of
#       the 129 are bare filenames that DO carry line numbers.
#   F4  STORY-219's AC7 was UNSATISFIABLE. It required fixing two known-real drifts
#       to LOWER config-layer.md's baseline. Both report OK today -- the em-dash
#       excerpt form at config-layer.md:271-272 is not read as an anchor -- so the
#       fix moves the count by ZERO. The AC could never have passed.
# The remaining 18, closed: STORY-217's ZR-8 citation was 100 lines stale after the
# 2026-08-12 wiki split (:671-678 -> :736) and its AC1 used a token grep that cannot
# decide its own condition; STORY-218 carried THREE wrong line citations inside the
# sprint about citation accuracy, and its "converge on config_dir's shape" note would
# have removed the class attribute harness.py:763 depends on, making its own AC4
# unsatisfiable; STORY-220 AC7 required bumping verified_sha, deleted repo-wide the
# day before (d9319d8), and its ">= 9" floor would go red on STORY-155's legitimate
# port removal; STORY-212 was NOT Definition-of-Ready.
verification:
  verdict: GAPS
  findings: 20
  all_closed_before_po_saw_plan: true
  passed_unchanged:
    - "STORY-219's 129-failure measurement reproduced exactly: 73/18/17/15/2/1/1/1/1, eight articles at zero."
    - >-
      STORY-220's discovery rule reproduces pyproject.toml:134-144 entry for entry -- 9 modules from
      (*_repository.py + watermark.py); the three excluded (clock.py, signal_ingest.py,
      status_publisher.py) match neither rule.
    - >-
      *** STORY-217's expiry condition has NOT fired, so the sprint is NOT oversized. *** No core
      service imports ComponentRepository or SignalRepository (grep "from src.core.ports"
      backend/src/core/services/ -> approval.py:17, decide.py:40, ingest_service.py:24 only);
      "set_status|component_repo|signal_repo" across core/services/ -> EMPTY.
    - "Execution order 217 -> 220 -> 218 -> 219 -> 212 independently confirmed correct."
  order_rationale_corrected: >-
    The plan reached the right order for a partly wrong reason. STORY-218 is NOT "independent of the
    wiki chain": it edits settings.py (cited by line at zone-rules.md:309,:415 and
    zone-rules-history.md:518,:532,:564), harness.py (zone-rules.md:517,:913 + five in the history
    file), and test_settings.py:30 -- which carries one of only EIGHT anchor-checked citations
    repo-wide. It must precede STORY-219 because it shifts lines in three line-cited files.
    Separately, the sprint's third contract-sensitivity justification was WITHDRAWN: STORY-217 AC2
    appends to ZR-8's BODY at :736-767, not to the Adjudication row at :878.

