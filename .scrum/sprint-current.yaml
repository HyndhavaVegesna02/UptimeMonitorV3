  - id: RC-10
    raised: 2026-08-12 (STORY-207, raised by the implementer itself)
    severity: medium
    text: >-
      TWO RULES THIS PROJECT HOLDS ARE IN TENSION, AND AN IMPLEMENTER HIT IT HONESTLY RATHER THAN
      QUIETLY PICKING ONE. Strict TDD with "a commit after every green step" (the crash-recovery
      mechanism) versus AC/A18's "correct the wiki and bump verified_sha in the SAME commit" as the
      code change. When the wiki correction CITES code that does not exist until a later step, the
      two cannot both be honoured: STORY-207 landed the guard docstring at 3a7fc0f and the
      zone-rules residue correction at f342d07, then needed two more commits for verified_sha
      because a ruff-format pass touched a code_ref in between. The end state was correct and
      sweep-CLEAN, and the implementer disclosed the deviation unprompted.
      WHAT NEEDS A RULING: whether A18's "same commit" means literally one commit, or "the same
      story, with no intervening commit that leaves the repo asserting something false". The second
      reading is what the rule is FOR -- it exists to stop a doc ripple landing later than the code
      it describes and being forgotten. The first reading fights the commit cadence that makes
      agent death survivable, and this sprint has lost two agents to session limits.
      Note this is the SECOND time this exact seam has produced work: RC-9 is the same rule failing
