# CAPACITY / DELIBERATE OVER-COMMIT: recorded velocity last-3 = sprint 34 (?), 36 (6), 37 (3)
# -> low; measured mean historically ~5.3. Committed 31 points (055=5, 056=5, 057=5, 058=3,
# 059=5, 060=3, 061=3, 062=2) — a ~5-6x OVER-COMMIT. This is an EXPLICIT PO directive
# (2026-07-07): "after planning is done I want a single sprint finish" + "spin up multiple
# Sonnet 5 HIGH agents for independent works". The size risk (partial completion if the
# session budget runs out) was flagged to the PO once and accepted. Ordering front-loads the
# highest-blast-radius foundation so a partial finish still leaves a coherent shippable subset.
#
# PARALLEL EXECUTION MODEL (PO-directed multi-agent): wave-based, because the eight stories are
# NOT all independent.
#   Wave 0 (SOLO, blocking): 055 design-system foundation + shared primitives — everything
#     inherits its tokens/fonts/components/primitives. Must be gate-green + committed on
#     sprint-38 before any other dispatch.
#   Wave 1 (SOLO, blocking): 056 shell — every page renders inside it; it also relocates the
#     sample-mode toggle out of DashboardPage (which 057 then rebuilds), so it precedes 057.
#   Wave 2 (PARALLEL, worktree-isolated): 057-062 page redesigns fan out as up to 6 concurrent
#     Sonnet-5/HIGH implementers, each in its own git worktree (isolation:'worktree') on
#     DISJOINT files (own page.tsx/.css + features/<tab> + tests + MSW handler). Rationale: a
#     shared working tree + git index cannot take concurrent writers (violates the 2026-06-24
#     clean-tree/scoped-staging agreement).
#   Integration is SERIAL: branches merge into sprint-38 one at a time; Opus spec+quality
#     reviews (057-061) and the frontend DoD gate run serially per story — NEVER concurrent
#     npm test/vite build, per the 2026-07-06 CPU-contention false-red agreement.
#
# PIPELINE: 055-061 are 3+ pts -> full pipeline (Sonnet 5 / HIGH implementer + Opus spec
# reviewer + Opus quality reviewer + DoD gate). 062 is 2 pts -> gate-only. Per the 2026-06-24
# + 2026-07-02 model rules. Frontend-only sprint: each story runs the frontend three-gate DoD
# (npm test / build / lint) on a clean committed tree AND must show an EMPTY backend diff
# (git diff sprint-38-start..HEAD -- backend/ scripts/ config/ migrations/ pyproject.toml
# alembic.ini). The npm test contention rule (2026-07-06) applies: a parallelism/CPU false-red
# is proven (empty diff on the failing unit + passes isolated/serialized) then re-run with
# `npx vitest run --no-file-parallelism` for the valid signal.
#
# CONSUMER-DTO / CONTRACT CHECK (2026-07-07, at planning — per the 2026-07-02 + 2026-07-04
# agreements): every rendered field verified against the real producing contract. Gaps found
# (design shows richer data than the API exposes) → the frontend ADAPTS (omits/substitutes a
# real field, never fabricates) and the gap is filed as a backend follow-up:
#   - ProposalDTO {id, component_id, from_status, to_status, state, proposed_at} — NO severity/
#     reason/source/triggering-signals. STORY-059 derives severity from to_status; omits rest -> STORY-063.
#   - ObservationDTO {signal_key, observed_at, health, location, latency_ms} — NO HTTP code / check
#     type. STORY-060 omits those two columns -> STORY-064.
#   - MaintenanceWindowDTO {id, component_id, starts_at, ends_at, reason} — NO title; NO DELETE
#     endpoint. STORY-061 maps "title"<->reason; omits delete -> STORY-065.
#   - PublicationDTO {id, component_id, status, published_at, proposal_id} — NO author/outcome/
#     incident. STORY-062 omits those -> STORY-066.
#   - ComponentDTO {id, name, status} — NO group; NO per-component uptime-bucket API. STORY-057
#     renders ONE group + omits sparkline segments where no data (uses availability/history only) -> STORY-067.
#   NUMERIC SCALE pinned (2026-07-04): availability_pct / completeness_pct are 0-1 FRACTIONS on the
#   wire (existing formatPct handles the *100); MSW fixtures for redesigned pages derive from the
#   existing handler fixtures (already real-shape), not re-invented.
#
# TOOLING: no new MCP/CLI. The only dependency adds are `@fontsource/geist` + `@fontsource/geist-mono`
# (self-hosted Geist per the mock, no CDN) — added within STORY-055; CLAUDE.md tooling inventory
# updated in the same commit per the 2026-06-23 command-sync agreement if the frontend stack line
# changes.
#
# BASELINE at lock: sprint-38 cut from main @ c548c39 (tag sprint-38-start). Last green gates
# (sprint-37, merged): backend 513 passed; frontend 230 passed (single-threaded valid signal).
# This sprint touches frontend/ ONLY; backend diff must stay empty.
#
# PARKED SPRINT NOTE (unchanged): sprint 35 (STORY-017 deployment) remains PAUSED/unmerged on
# branch sprint-35 (PO 2026-07-06). Sprint-38 is frontend-only and does NOT touch STORY-017's
# CORS/deploy-config diff; the eventual sprint-35 rebase gains no new conflict beyond the usual
# .scrum/CLAUDE.md/pyproject bookkeeping.
#
