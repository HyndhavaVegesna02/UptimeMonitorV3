    title: composition/seed_dynamo.py must call the persistence adapters' key schema, not re-implement it
    file: docs/scrum/stories/STORY-205-seed-dynamo-must-not-own-key-schema.md
    points: 3
    order: 1
    status: todo
    why_here: >-
      HIGHEST BLAST RADIUS, RUNS EARLY. ZR-8 Finding 1 -- the audit's biggest single miss, found only
      in STORY-196's quality-review fix round because it fell through the crack BETWEEN the two audit
      passes (195 covered adapters/, 196 covered composition/, and this is composition/ doing
      adapters/'s job). Three hand-built topology keys on the boot path of BOTH composition roots.
      Re-derived at planning: `grep -rn '"TOPOLOGY"' backend/` = 10 sites (5 repositories, 3
      seed_dynamo, 2 tests).
      AC2 IS LOAD-BEARING AND CAME FROM THE AUDIT'S OWN FILING NOTE: change the schema INSIDE a
      repository and assert seed_topology_dynamo follows AUTOMATICALLY with seed_dynamo.py
      unchanged -- a BEHAVIOURAL drift test, not a source assertion. It is the only AC that proves
      the duplication is gone rather than relocated.
  - id: STORY-204
    title: Reuse the adapter's DQL builder validation inside composition/vendor_health.py (GAP-2)
    file: docs/scrum/stories/STORY-204-vendor-health-reuse-dql-validation.md
    points: 2
    order: 2
    status: todo
    why_here: >-
      MUST PRECEDE STORY-203 (see plan_verification finding 1). ZR-8 Finding 2: vendor_health.py
      builds DQL without query.py's _DQL_BREAKING_CHARS validation, and the probe it feeds runs
      FIRST, at loop startup -- so the same misconfigured native_id raises loudly on the ingest path
      and silently builds a malformed query on the startup path.
      SHAPE DECIDED AT REFINEMENT: move the BUILDER into the adapter, not merely share a validator.
      ZR-8 says query construction lives in exactly ONE adapter; the validator-only fix leaves
      composition building DQL, which IS the violation.
  - id: STORY-203
    title: Batch the four MINOR ZR-3 duplications — tools/ should import shared literals from backend/src/
    file: docs/scrum/stories/STORY-203-tools-import-shared-literals.md
    points: 2
    order: 3
    status: todo
    why_here: >-
      Four MUST-IMPORT-FROM-SRC entries, all MINOR, NONE a live defect today -- every value
      currently agrees; each is a drift risk the next person editing the backend/src/ side cannot
      learn about from tools/'s own code. Measured at planning: 13 colliding pairs, 4 of them
      MUST-IMPORT-FROM-SRC; expected 9 after (AC5 requires re-deriving, not predicting).
      AC2 GUARDS THE REAL RISK: two of the four sit inside a DEFENSIVE BLOCKLIST asserting the
      resolved table name is NOT the production default, and a careless "just import the constant"
      fix turns that blocklist into a tautology.
      AC4 REQUIRES A GENUINE DECISION on the fifth, CROSS-REPRESENTATION case (store.py's
      timedelta(hours=2) vs "2h", structurally invisible to any literal-equality sweep): store.py
      already carries a written WIRE-CONTRACT justification that may well be correct, and upholding
      it is a legitimate outcome -- but leaving an _ADJUDICATED entry pointing at a closed story is
      a fail.
  - id: STORY-215
    title: Close the remaining env-var-NAME drift — the two DYNATRACE_* names, plus the file that guards the publish guard
    file: docs/scrum/stories/STORY-215-env-var-name-drift-remainder.md
    points: 3
    order: 4
    status: todo
    why_here: >-
      RUNS LAST; ENABLER FOR SPRINT 69's STORY-209. FOUR sites, not the two its old title named:
      (1) env_matrix.py:81,83 and (2) harness.py:614 re-type the DYNATRACE_* pair, whose DECLARING
      side (settings.py:114,116,117,119) is itself a function-body literal -- there is no constant to
      import yet, which is exactly why 202 left them;
      (3) *** backend/tests/test_demo_fleet_config.py:164,200 -- THE CONSEQUENTIAL ONE. A FOURTH
      FILE outside 202's scope, flagged by BOTH sprint-67 reviewers independently as a real residual
      defect. It is STORY-176's file: the create_app test asserting CONFIG_DIR governs PUBLISHER
      SAFETY. So the literal that re-creates the drift risk sits in the test that guards the PUBLISH
      GUARD -- CONFIG_DIR selects config/demo, which empties statuspage_mapping(), which is what
      yields a LoggingPublisher, and `decide` publishes recoveries with NO human gate. A rename that
      silently missed this test would leave it GREEN WHILE ASSERTING NOTHING. Note the ZR-3 sweep is
      STRUCTURALLY BLIND to it (it compares backend/src declarations against tools/ literals; this
      file is under backend/tests/), which is why nobody adjudicated it -- so its fix needs its own
      mutation, AC5. ***
      (4) scripts/seed_topology.py:25 -- found at THIS refinement, absent from the audit's list: an
      independent declaration of both the NAME and the "config/apps" DEFAULT, in a third process.
      RESIZED 2 -> 3 AT REFINEMENT. Promoting two new constants re-runs STORY-202's own trap:
      newly-declared shape-i values turn existing tools/ literals into FRESH ZR-3 collisions, the
      sequence that took 202 from 1 point to 3. AC6 expects the sweep count to move BOTH ways.
      Last in order because it re-keys _ADJUDICATED line numbers, and doing it after STORY-203 means
      ONE re-keying pass instead of two -- the precise churn STORY-202 caused STORY-203 last sprint.
      EXPLICITLY NOT IN SCOPE: test_settings.py:30 (`assert CONFIG_DIR_VAR == "CONFIG_DIR"`) is the
      PIN, not a duplication, and must survive untouched. A test ASSERTING a constant's value is
      protection; a test RE-TYPING the name to consume it is drift. That distinction is the whole
      difference between this exclusion and site 3.

