goal: >-
  Turn sprint 66's audit report into landed fixes. A report is a document; a document does not fix a
  production defect. Fix the highest-severity findings and shrink both standing guards' exemption
  lists -- ZR-7 from SIX entries to ONE, ZR-3 losing its two STORY-202 entries -- and harden the DoD
  gate against the policy that took it red mid-sprint. The success measure is mechanical because
  sprint 66 built it: every RETIRED entry names the story meant to remove it, and each guard's
  stale-exemption test goes RED if a fix lands without its entry being removed.
  *** THE ARITHMETIC WAS WRONG WHEN THE PO APPROVED IT, AND IS CORRECTED HERE. The plan and this
  goal both said "five entries to zero". _EXEMPTIONS holds SIX. The sixth --
  dynamo_publication_repository.py:53 -- is a PERMANENT entry for list_recent, whose port promises
  "up to `limit`" (a stated bound, not completeness), and STORY-199's own "Not in scope" paragraph
  says so correctly. IT STAYS. An implementer following the approved text literally would have
  emptied the dict and taken the DoD gate RED. Found by plan verification AFTER the lock, verified
  independently by the orchestrator (six keys enumerated via AST), and reported to the PO rather
  than quietly corrected -- it was the sprint's headline success measure. ***
