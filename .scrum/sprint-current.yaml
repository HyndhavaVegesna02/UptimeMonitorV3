  - id: STORY-183
    title: Demo engine — bound the token cache by RETENTION, not by consume-on-first-poll
    file: docs/scrum/stories/STORY-183-demo-engine-token-cache-retention.md
    status: todo
    points: 1
    ceremony: 1-2-pointer
    order: 3
    plan_note: "AC2-vs-AC5 IS SETTLED, NOT OPEN, and the evidence is documented: replacing
      STORY-180's test_results_cache_is_evicted_after_being_polled is the correction AC2 mandates,
      NOT a wire-contract change AC5 forbids. That test's own docstring attributes it to 'STORY-180
      AC4 (minor 5)' (test_server.py:92-96) and the pop comment attributes the consume semantics to
      STORY-180 (server.py:117-123); AC5's enumerated contract (seven row fields, ns scale, both
      grammars, async execute/poll, the 'Api-Token ' prefix) does not include cache-eviction
      semantics. The replacement MUST keep asserting the bound, which AC4 does.
      THREE VERIFIER CORRECTIONS TO CARRY IN THE BRIEF: (a) A4 — the cache is
      _DemoHTTPServer.results (server.py:48), reached from tests as server._httpd.results
      (test_server.py:106); AC4's own text and the first plan draft both write server.results.
      (b) A2 — AC4's bound is VACUOUS with a stopped injected clock and lazy eviction: N executes
      leave N entries and `len(...) <= N` passes while the leak is fully intact. The test must
      advance the injected clock past retention BETWEEN executes and assert a bound STRICTLY BELOW N
      (ideally 1). (c) A5 — _DemoHTTPServer extends ThreadingHTTPServer (server.py:37) over a bare
      dict, so the sweep must take a lock or iterate a list() snapshot; STORY-182 will drive 41
      concurrent signal loops through it."
    reality_gate_spec: "Two-sided with DIFFERING sides: tiny retention -> the unpolled entry is gone
      and the length is bounded; large retention -> the same sequence keeps the entry and a repeat
      poll returns 200 with identical records. TWO TRAPS CLOSED (A3): (i) if the implementation
      copies retention at SERVER CONSTRUCTION, monkeypatching the module constant afterwards has no
      effect and BOTH SIDES BEHAVE IDENTICALLY — the sprint-63 _delegate shape again. The harness
      must print the server INSTANCE's effective retention before reporting either side, and prefer
      advancing the injected clock over patching the constant. (ii) provenance is checked for
      `demo_engine.server` SPECIFICALLY — under pytest from a worktree that module resolves to the
      WORKTREE (conftest.py:37-39 inserts .../tools at sys.path[0]) while src.* resolves to the MAIN
      tree via the .pth, so a generic under-cwd check would give a false green here."
