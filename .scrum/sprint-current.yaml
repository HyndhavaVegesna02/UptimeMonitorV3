      token grep `grep -rn "topology\|APP#" backend/src/core/` has now produced THREE different
      counts for the same command against the same source: TWELVE (sprint-69 planning), THIRTEEN
      (sprint-70 plan verification), NINETEEN (the STORY-217 implementer, same day as the 13).
      The implementer reported the 19 honestly and flagged it as a second drift rather than quietly
      matching the brief -- correct behaviour, and the reason this is visible.
      THE ORCHESTRATOR THEN ISOLATED THE CAUSE, and it is worse than drift:
      `--exclude-dir=__pycache__` gives 13; SIX of the 19 hits are compiled `.pyc` artifacts. So the
      number depends on whether anything happened to run recently. NEITHER agent was wrong; the
      METHOD was, in a way none of the three measurements could reveal on its own.
      WHY IT IS WORTH THE RETRO'S TIME rather than just a story note: STORY-217's AC1 retired this
      grep for a DIFFERENT and weaker reason (it cannot see a write method lacking those tokens).
      The real defect is that a recursive grep over a source tree silently includes build output,
      and this project cites grep counts as evidence in story History, plan verification and
      catalogue Facts. Ask whether the evidence conventions should require source-only globs
      wherever a COUNT is the claim. Candidate rung: the implementer checklist, or a lint over
