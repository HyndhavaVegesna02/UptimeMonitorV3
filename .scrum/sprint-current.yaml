parallelism_ruling: >-
  Analysed before lock at PO request. FILE AND WIKI FOOTPRINTS ARE DISJOINT except 179/213 (both
  reach conftest.py -> demo-engine.md + persistence-adapters.md). But the REAL serializer is the
  GATE, not the files: `python -m pytest` runs the whole suite, so two implementers committing to
  one branch means each one's gate observes the other's half-finished work, and "green at my commit"
  -- the acceptance evidence -- stops meaning anything. Worse, STORY-179 CHANGES THE HARNESS every
  other story gates on. A parallel shape (222 || 201 || 189 in worktrees, then 179 alone, then 213)
  would save roughly one wave out of five steps while requiring a NEW integration-gate semantics the
  DoD does not describe. DECIDED: run sequentially. 5 of the 10 points are serial regardless.

