goal: "Close the live ingest gap surfaced by STORY-016b's AC6 run: the PO's monitor emits TWO event types
  per execution — http_monitor_execution (the canonical per-run verdict) + http_step_execution (the per-step
  row), sharing the same event.id. The dispatch registry only knew http_step_execution, so the live loop
  crashed with UnsupportedMonitorTypeError on the monitor_execution row; and normalizing both would collide
  on UNIQUE(observations.source_event_id). Reconcile the adapter to ingest exactly ONE canonical observation
  per execution: build_dql_query filters event.type == http_monitor_execution (excludes the duplicate step
  row at source); dispatch registers http_monitor_execution -> normalize_http_row (the row carries every
  field the normalizer already reads, so no normalizer-body change). Reconcile the recorded fixture + the 3
  consuming test files to the canonical type. Then re-run the loop against the live tenant to confirm green
  (AC6, the manual internal verification STORY-016b deferred). Single story, 3 pts."
