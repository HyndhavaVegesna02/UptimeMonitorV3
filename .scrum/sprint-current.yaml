      subprocess env (script rung) — STILL OPEN (yt_gate.py only reconfigures its own streams, not
      the child env; the orchestrator must export PYTHONUTF8=1)."
  - artifact: "git-guard hook used a bare relative path (python .claude/hooks/yt_git_guard.py) that
      failed to resolve once a shell CWD moved off the repo root (e.g. after `cd frontend`), blocking
      all subsequent shell calls. FIXED at f53819e: use $CLAUDE_PROJECT_DIR so it resolves absolutely.
      RETRO: the YourTeam hook template should ship the $CLAUDE_PROJECT_DIR form (agent-definition/
      template rung)."

