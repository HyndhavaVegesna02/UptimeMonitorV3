# YourTeam active sprint board. No active sprint when status: none.
sprint: 62
status: active     # none | planning | active | review | closed | aborted
                   # LOCKED 2026-07-28 on PO approval ("i am ok with your recomendation").
                   # SCOPE IS NOW FROZEN. New PO requests go to the backlog, not this sprint.
                   #
                   # Two yt-plan-verifier passes ran pre-lock, both verdict GAPS, all closed:
                   #   Pass 1 — 13 gaps, 4 risks. Split STORY-148, deferred STORY-147.
                   #   Pass 2 — independent/fresh context, briefed to attack the FIXES. Found
                   #     3 fix-introduced errors (config.py:183 listed as untouched while being
                   #     deleted; the publish guard missing the API's own CONFIG_DIR route; the
                   #     "6-digit fraction" claim, wrong because isoformat() drops the fraction
                   #     at whole seconds) plus ONE BLOCKER both passes and the SM missed.
                   # PO decisions resolving pass 2, recorded in plan.md "Decisions — RESOLVED":
                   #   D-A -> Option B. No DOWN/DEGRADED observation can reach the system via the
                   #     real ingest path at all (health_mapping.py:65-70 RAISES; dispatch.py:80
                   #     then loses the whole batch), so the demo is scoped to UP + absence.
                   #     STORY-149's gate moved to orchestrate_signal-level over SEEDED
                   #     observations — as a demo gate it would have FALSE-PASSED step 1 (no
                   #     proposal because nothing ingested, not because anti-flap damped it) and
                   #     failed step 2 on the sprint's last story. Provisional mapping = STORY-177.
                   #   D-B -> STORY-176 moved to sprint 63. Honest re-estimate was 12-13 pts vs
                   #     the ~9-11 baseline; this sprint is 9 pts / 3 stories and the goal was
                   #     restated from "the fleet exists, and it flows".
mode: in-process   # Standing directive after the sprint-60 external rejection: "you only
                   # implement". 146 (5 pt) and 148 (3 pt) -> implementer -> spec ∥ quality
                   # reviewers; 149 (1 pt) -> implementer -> gate.
                   # Every story gets the DoD gate + a reality gate.
goal: "Land the config authoring shape that communicates the component -> monitor -> location hierarchy; build a Grail-faithful demo-engine wire contract proven field-and-scale against a real captured sample and through the real executor; and close the one anti-flap damping hole that goes live the moment a second location exists. Backend only; no frontend work. The 12-component fleet RUN is STORY-176, opening sprint 63 (PO decision D-B)."
