  WHEN SPRINT 69 CLOSES, EVERY ZR-1..ZR-8 RULE HAS A TERMINAL VERDICT. ZR-6 has no standing guard
  BY DESIGN (its own Coverage verdict rules out a hard-failing contract) and ZR-5's operational
