incidents:
  node_modules_destroyed_during_review: >-
    *** frontend/node_modules WAS DESTROYED DURING THE STORY-221 CONCURRENT REVIEW WINDOW AND HAS
    BEEN REPAIRED. Not a defect in the diff; a process hazard worth a retro item. ***
    FOUND: the quality reviewer reported it mid-review (199 top-level entries, no .bin/vitest, no
    .package-lock.json, @jridgewell/sourcemap-codec missing so magic-string fails to import).
    Neither reviewer attempted repair -- correctly, since a repair would have raced the other one.
    CONFIRMED independently by the orchestrator: node_modules was a REAL directory, not a reparse
    point, and no install process was running, so nothing was mid-install.
    REPAIRED with `npm ci` in frontend/: 300 packages, exit 0, 23s. Healthy state is **216
    top-level entries**; the broken state was 199.
    *** THAT 216-vs-199 GAP IS THE FINDING. *** The spec reviewer junction-linked node_modules into
    a scratch worktree to avoid a reinstall, removed the junction with a reparse-point-only delete,
    and verified cleanup by confirming "the real node_modules still had its 199 top-level entries
    intact". 199 WAS ALREADY THE DAMAGED COUNT -- so that verification compared the damage against
    itself and read it as healthy. It also noted every package's mtime was 2026-07-02 (the original
    install), which is consistent: deleting whole package directories does not restamp the
    survivors. This is the leading hypothesis, not proof -- an interrupted `npm ci` by some other
    process would leave the same signature, and the missing `.package-lock.json` (npm writes it
    last) fits that too. What IS certain is that the damage happened inside the review window and
    that the cleanup check could not have detected it.
    LESSON FOR THE RETRO (do not act on it mid-sprint): a subagent junction-linking a shared,
    expensive, gitignored directory is a hazard the git-discipline hook cannot see, because
    node_modules is not tracked -- `git status` stays clean through total destruction. A cheap
    guard would be a healthy-baseline count or a `.bin/vitest` existence check, and the natural
    rung is a preflight in yt_gate.py rather than prose.
    VERIFIED AFTER REPAIR: npm test / build / lint all PASS, 51 files / 363 tests; no stray git
    worktrees (`git worktree list` shows only the main tree); tree clean.

