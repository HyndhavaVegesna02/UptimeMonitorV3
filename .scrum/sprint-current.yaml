constraints:
  C1: >-
    NOTHING LANDS WITHOUT SOMETHING GOING RED FIRST. Every story carries an explicit mutation or a
    pre-fix-failing test. Carried from sprint 67, where it worked.
  C2: >-
    RE-DERIVE EVERY NUMBER; NEVER COPY ONE. Counts, line numbers and sweep totals are measured at
    HEAD by the story that quotes them. If a figure does not reproduce, SAY SO rather than editing
    it. Sprint 67 hit this twice (a 105 that measured 101; a restated mutation number).
  C3: >-
    PROSE THAT MISINFORMS IS A BLOCKING DEFECT, NOT A NIT. TEN of sprint 67's ELEVEN blocking review
    findings were documents made false by the very commit that wrote them. Every story here touches
    zone-rules.md; each carries an AC requiring the catalogue to move in the SAME commit as the
    code, INCLUDING the paragraphs below the adjudication table (sprint 67 found a row and the
    paragraph nine lines under it contradicting each other, in one commit).
  C4: >-
    NO ENFORCED-BY CLAIM WIDER THAN WHAT THE GUARD ACTUALLY CHECKS. Sprint 67's MAJOR-1: a row
    claimed a guard that did not exist, disproved by reverting the whole fix and watching the suite
    stay at 696 passed. STORY-205 AC6 and STORY-203 AC7 state it per-story; STORY-216 mechanises it
    next sprint.
  C5: >-
    REQUIRE_DYNAMO SET ON EVERY GATE RUN (agreement A6). A nonzero skip count is an INCOMPLETE GATE,
    not a pass -- a green pytest once hid the entire 53-test persistence floor because Docker was
    down. STORY-213 and STORY-205 are both DynamoDB-gated.
  C6: >-
    BRANCH STAYS UNMERGED. Sprints 66 and 67 are unmerged; 68 cuts from 67. Nothing touches main.

