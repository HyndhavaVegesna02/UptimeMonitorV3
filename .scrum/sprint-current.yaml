  planning, here or in any future sprint. Dispatch per the skill's own scaling rule.
  EVERY STORY IN THIS SPRINT IS 2 POINTS OR MORE, so every one gets the full ceremony:
  yt-implementer, then yt-spec-reviewer || yt-quality-reviewer CONCURRENTLY (they are independent
  and must not be serialised), then the mechanical DoD gate, then the reality gate. NO STORY REACHES
  REVIEW UNREVIEWED.
  WHY THIS MATTERS MORE THAN USUAL HERE: all four sprint-67 stories PASSED spec review and FAILED
  quality review -- four for four, the fourth consecutive sprint the independent pass caught
  something real. Eleven blocking findings; TEN were PROSE, not code -- documents made false by the
  very commit that wrote them. This sprint is the same shape: small diffs whose defects will live in
  the accompanying catalogue prose. That is what constraint C3 exists for, and it is what the
