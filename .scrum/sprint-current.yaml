  - id: STORY-196
    title: Audit api + composition and the tools/ to src/ one-way boundary
    file: docs/scrum/stories/STORY-196-audit-api-composition-tools-boundary.md
    status: done
    points: 2
    ceremony: implementer + both reviewers + fix round (spec PASSED first time; quality FIX_REQUIRED)
    result: >-
      DONE at b5ef06e. Delivered docs/scrum/sprints/2026-07-31-sprint-66/audit-api-composition-tools.md
      over all 85 modules (api 55, composition 13, tools 17), each listed with a verdict AND an
      explicit full-read vs grep-verified annotation -- the lesson from STORY-195's review applied.
      *** SPEC REVIEW PASSED ALL SIX AC ON THE FIRST PASS, and did the strongest verification seen
