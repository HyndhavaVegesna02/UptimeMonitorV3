    "test"/"test" whenever an endpoint is set (composition/dynamo.py:23-24). Tables created under
    other credentials are INVISIBLE to the real entrypoint and surface as ResourceNotFoundException,
    which looks exactly like a seeding defect.
  publish_safety: >-
    NEVER run `python -m src.composition.run` -- decide publishes recoveries with NO human gate. If
    you construct create_app(), PIN CONFIG_DIR=config/demo: config/apps declares a REAL
    statuspage_component_id and the repo-root .env supplies real credentials FROM ANY LAUNCH
    DIRECTORY, so the config-only guard is the only thing between a probe and the live page.
    STORY-209 touches both composition roots -- source-level mutations only, no loop run.
  tooling: >-
    Console-script shims are blocked by Device Guard -- module form only (python -m pytest,
    python -c "from importlinter.cli import lint_imports_command; lint_imports_command()",
    python -c "from cfnlint.runner import main; main()" infra/stack.yaml).
    A PreToolUse hook BLOCKS bulk git staging during an active sprint -- stage explicitly.
  known_flake: >-
    STORY-213 (1-in-11, list_components pagination). Did NOT fire once in sprint 68. If a gate run
    hits it, RE-RUN AND SAY THAT YOU DID.
  grep_trap: >-
    `grep -c MUST-IMPORT-FROM-SRC` is MISLEADING (it counts the string across reason prose, not dict
    entries). AST-parse _ADJUDICATED instead.

