    (2) STORY-205'S SHAPE WAS UNDECIDED AND IS NOW DECIDED. Its filed note flagged the sizing risk
        ("may need a third method or a small new TopologyRepository port"). Refinement chose the
        schema-module option ZR-8's own Coverage verdict already sanctions in writing, keeping it at
        3 points. A new core-owned port for a value NO core service reads or writes would launder a
        boot script through the core.
    (3) STORY-215'S SCOPE WAS UNDERSTATED BY ITS OWN TITLE. A third CONFIG_DIR reader --
        scripts/seed_topology.py:25, `os.environ.get("CONFIG_DIR", "config/apps")`, bypassing
