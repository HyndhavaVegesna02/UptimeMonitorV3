board:
  - id: STORY-221
    title: "`npm test` false-reds under gate load (MaintenancePage)"
    points: 3
    order: 1
    status: done
    file: docs/scrum/stories/STORY-221-frontend-gate-flake-maintenance-page.md
    dispatch_reverify: >-
      RE-VERIFIED AT DISPATCH 2026-08-14 (plan risk 7), all three planning measurements HOLD at
      bb480d1: userEvent.setup() at 66 sites across 20 files with ZERO non-default-argument call
      sites (so `delay: null` is nowhere in the suite yet); the 10 datetime-local user.type calls at
      MaintenancePage.test.tsx:286, 287, 332, 333, 366, 367, 399, 400, 437, 438 exactly as cited;
      frontend/vite.config.ts declares environment/globals/setupFiles/css ONLY -- no pool,
      poolOptions or fileParallelism -- confirming AC2's prohibition there is PREVENTIVE, closing a
      route that is currently open rather than describing an existing setting.
      WIKI: frontend-zone.md is tier=map, status=STALE -> QUARANTINED, so none of its claims enter
      the brief. MaintenancePage.test.tsx is in NO article's code_refs. NOTE frontend/src/test/
      setup.ts IS a code_ref of frontend-zone.md -- if the fix lands there the sweep will say so
      after the last commit; do not pre-declare it (plan-verification.md:19).
    ceremony: "implementer -> spec reviewer + quality reviewer (concurrent) -> gate -> reality gate"
    why_first: >-
      It taxes everything after it. This sprint runs `npm test` many times; at the filed 2-in-4 rate
      every later gate red must go through the two-limb attribution protocol before it can be
      believed. Fixing it first is the only ordering in this sprint that pays for itself.
    carry_into_brief: >-
      MEASURED SEAM: userEvent.setup() is called with DEFAULT options at 66 sites across 20 files.
      user.type() on a datetime-local field types the full '2026-07-09T09:00' literal -- 16
      keystrokes, so 16 AWAITED MACROTASKS per field -- at MaintenancePage.test.tsx:286, 287, 332,
      333, 366, 367, 399, 400, 437, 438. That is 10 user.type calls across 5 tests, ALL IN ONE FILE;
      no other test file in the suite types a datetime-local. That containment is what holds the
      estimate at 3.
      CONFIRMED VIABLE AT VERIFICATION: userEvent.setup({ delay: null }) works -- utils/misc/wait.js
      returns early when typeof delay !== 'number' -- so AC2 does not block the story by construction.
      HONEST NEGATIVE IS PERMITTED AND MUST NOT BE MANUFACTURED: it went 2-in-4 on 2026-08-06 but
      0-in-3 across sprint 71's full gate runs. Two flakes in this repo evaporated before their fix
      (STORY-178; STORY-213 at 0-in-12). AC1 explicitly allows a negative; AC4 forbids presenting an
      uncomparable before/after as if it were one.
      AC3 IS THE PROOF THAT MATTERS: mutation -- the 5 affected tests must still FAIL when the 422
      render is broken. A faster test that no longer tests is the failure mode here.
    commits: "e60b3c7 (single commit; 5 call sites + comments, 16 insertions / 5 deletions, one file)"
    implementer_report: >-
      *** THE FLAKE DID NOT REPRODUCE, AND THE IMPLEMENTER SAID SO RATHER THAN MANUFACTURING ONE.
      AC1 8 gate-shape runs at dc28502: 0 failures in 8. AC4 8 more at e60b3c7: 0 failures in 8. ***
      Both sides 0-in-8, so there is NO before/after delta and the report explicitly declines to
      present one -- which is what AC4 demands. The fix rests on the seam analysis plus AC3's
      mutation proof, not on a flake-rate improvement. Recent history is now 0-in-4 full gate runs
      (sprint 71) + 0-in-1 (this sprint's baseline) + 0-in-16 here.
      CHANGE: the 5 userEvent.setup() sites preceding the 10 datetime-local user.type calls become
      userEvent.setup({ delay: null }). Nothing else under frontend/ touched -- vite.config.ts,
      package.json and tsconfig*.json verified unchanged (AC6).
      AC3 CLAIMED: mutating useMaintenance.ts::schedule to `return true` failed exactly the 5
      affected tests, 8 others green; mutation reverted, empty diff verified.
      AC7 CLAIMED: full 8-command gate at e60b3c7, exit 0, 816 passed / 0 skipped, 51 files / 363
      tests in 58.75s. Wiki sweep CLEAN, nothing to update.
      *** THE NUMBER THAT DOES NOT FIT, AND IT IS FLAGGED FOR BOTH REVIEWERS: npm test got SLOWER,
      not faster -- mean 50.02s -> 55.65s (+11.2%), median 47.34s -> 53.36s (+12.7%). *** Removing
      32 awaited macrotasks per affected test should be FASTER. The implementer attributes it to
      system-load noise (observed range 44-82s) and notes the change touches 5 of 363 tests, so a
      real effect would have to be large per-test. Under AC5's stated 20% threshold and disclosed
      rather than absorbed -- but "disclosed" is not "explained", and both reviewers were asked to
      form their own view.
    orchestrator_independent_checks: >-
      Verified BEFORE dispatching reviewers, not taken on report: tree CLEAN; diff is exactly one
      file, 16 insertions / 5 deletions; `git diff --stat dc28502..e60b3c7 -- .scrum/` EMPTY, so the
      implementer wrote no orchestrator state and did not git-stash (the STORY-222 MAJOR did not
      recur); no leftover mutation in useMaintenance.ts.
    review_dispatched: >-
      Spec + quality reviewers dispatched CONCURRENTLY 2026-08-14 on range dc28502..e60b3c7. Both
      briefs require the AC3 mutation to be RE-RUN independently rather than accepted, and both were
      pointed at the wall-clock anomaly and at whether `delay: null` changes test SEMANTICS (fake
      timers, observation points for change/input handlers) and not merely speed.
    spec_review: >-
      **PASS**, all 7 AC met. AC3 RE-RUN INDEPENDENTLY in a scratch git worktree at e60b3c7 (never
      the live tree): baseline 13/13 pass; mutating useMaintenance.ts::schedule to unconditional
      `return true` gave 5 failed / 8 passed, the 5 being exactly the tests the diff touches. AC2
      re-grepped from the diff itself -- the only findBy*/waitFor match is inside a COMMENT, not a
      config change. AC6 re-confirmed by name-only diff. AC1's precondition independently checked
      (`git diff --stat bb480d1..dc28502 -- frontend/` empty).
      *** IT WENT PAST THE REPORT ON AC5 AND EXPLAINED THE ANOMALY. *** Breaking the 16 runs down by
      vitest phase: the `tests` phase -- the only one `delay: null` touches -- went DOWN (~53.5s ->
      ~52.3s), while the unrelated `environment` phase (jsdom spin-up across 51 files) rose ~160s ->
      ~185s and drove the total up. So the +11.2% is contention, not a cost of the fix.
      Minor report-hygiene defect found: before_summary.log's own tally lists 7 runs, but
      before_run8.log exists and shows PASS -- the raw data supports 0-in-8, the summary undercounts.
    quality_review: >-
      **APPROVE -- 0 critical, 0 major, 3 minor.** It refuted the tests-that-lie hypothesis BY
      EXECUTION rather than by reading: a 7-run mutation battery against the real committed tree
      (in-memory vite transform plugin, no repo file ever written), breaking six different product
      paths. All 5 affected tests fail when the path they name is broken, and none is vacuous. Two
      details beyond the headline: under the 422-neutralising mutations the tests fail at the
      ASSERTION, not earlier, so typing/validation/submit/POST all still ran under `delay: null`;
      and a bad-tz-conversion mutation proves the full 16-character literal still reaches the posted
      body, i.e. no keystrokes were silently truncated.
      *** IT ALSO SETTLED AC5 INDEPENDENTLY, by A/B-ing the fix in isolation on the same file/machine:
      the affected file's test time drops ~63% and the flaking test 4.7x (1296ms -> 273ms). Both
      reviewers reached the same conclusion by different routes. ***
      Comment mechanism verified against the INSTALLED package: wait.js does return early on a
      non-number delay, and keyboard/index.js awaits once per character, so "16 keystrokes / 32 real
      waits" is exact. No fake timers are active in this file (vi.setSystemTime without
      vi.useFakeTimers()), so skipping advanceTimers is inert -- SEMANTICS UNCHANGED, which was the
      open question at dispatch.
      Coherence of 5-of-66 checked and ACCEPTED: datetime-local typing exists nowhere else in
      frontend/src, these are the only options-passing setup() sites, and a setup.ts default would
      change delivery for 61 tests that never had the problem -- wider blast radius, no benefit.
    the_ac3_disagreement_and_it_was_MY_error: >-
      *** THE TWO REVIEWERS APPEARED TO CONTRADICT EACH OTHER ON AC3 AND NEITHER WAS WRONG. ***
      Quality reported that breaking the 422 render fails 4 of 5, not 5, and flagged the relayed
      claim as off by one. Spec reported exactly 5. They mutated DIFFERENT THINGS: `return true` in
      schedule skips the POST entirely, so the POST-success test fails too (spec, 5); whereas
      setMutationError(null) kills only the error path, so the POST-success test legitimately
      survives (quality, 4). The implementer's actual claim was the `return true` mutation, which
      spec reproduced exactly. WHAT WAS OFF BY ONE WAS MY PARAPHRASE IN THE QUALITY REVIEWER'S BRIEF
      ("break the 422 render"), not the implementer's report. Recorded as an orchestrator error, not
      an implementer one -- a brief that paraphrases evidence can manufacture a disagreement between
      two correct reviewers, which is worth a retro look.
    fix_round: >-
      Quality minors 1 and 2 fixed at 401fcb6. Minor 3 needed no fix (see above -- it was my error).
      MADE BY THE ORCHESTRATOR, NOT AN IMPLEMENTER, and recorded as such: the implementer was sent
      the two findings and DIED ON THE SESSION LIMIT (resets 4:10pm) before acting, and spending the
      reset budget on a fresh agent for a comment-only edit is a bad trade. `git diff` touches
      comment lines only; no code changed.
      What was wrong: (1) the comment said "nothing here waits less", which is FALSE and was
      contradicted by the six lines above it -- quality measured 273ms with the fix vs 1296ms
      without. Replaced with the intended meaning (no timeout raised, no parallelism reduced) plus
      the real numbers. (2) it asserted the gate-load mechanism as established FACT; the flake was
      0-in-8 before and 0-in-8 after, so it is unfalsified, not proven. The comment now says so.
    final_gate: >-
      Frontend commands re-run at 401fcb6 AFTER the node_modules repair: npm test / npm run build /
      npm run lint all PASS, 51 files / 363 tests, exit 0. Backend commands unaffected by this diff
      (one frontend test file) and green at bb480d1 + e60b3c7.
      WIKI SWEEP AFTER THE LAST COMMIT: sweep CLEAN, facts CLEAN, links CLEAN, integrity CLEAN.
      MaintenancePage.test.tsx is in no article's code_refs, as predicted. The 146 citation notes
      are the standing STORY-223 advisory, unchanged and not caused by this story.
    verdict: >-
      DONE. 3 points. Both reviews positive, both load-bearing proofs independently reproduced by a
      reviewer rather than accepted on report, minors fixed.
      *** WHAT THIS STORY ACTUALLY DELIVERED, STATED HONESTLY FOR THE PO: the flake was NOT
      reproduced (0-in-8 before, 0-in-8 after, on top of 0-in-4 across sprint 71 and 0-in-1 at this
      sprint's baseline). So determinism is NOT demonstrated. *** What IS demonstrated, and measured
      twice by two independent routes, is that the affected file's tests got ~63% faster and the
      suspect test 4.7x faster with no loss of assertion power (proven by a 7-mutation battery plus
      an independent worktree re-run). The story removed a real, measured source of timing pressure
      on the exact tests that flaked. Whether that was THE cause remains unproven, and the code now
      says so.

