sprint: 66
status: active     # none | planning | active | review | closed | aborted
                   # LOCKED 2026-07-31. SCOPE IS FROZEN -- new PO requests go to the backlog.
                   # Tooling is frozen too: no new MCP servers, no ad-hoc skill-script edits
                   # outside a story.
                   # PO DIRECTIVES THIS SESSION (2026-07-31):
                   #   1. "use your self reasoning ... dont ask my inputs, do your own reasoning"
                   #      -> full autonomy. Refinement, AC, the lock and every in-sprint judgement
                   #      call are taken in-process WITHOUT a PO check-in. Subagents ARE used (the
                   #      PO clarified the directive was about not asking THEM, not about agents).
                   #      Report decisions at review rather than asking first.
                   #   2. "the session limit is 44 so keep a look at it and before exhausting full
                   #      pause" -> watch the session budget and PAUSE WITH A HANDOFF before it is
                   #      exhausted. Every state edit is committed as it happens so any pause is
                   #      safe; the drop order in plan.md says what to shed if the session runs
                   #      short (196 first, then 197's second guard -- never 194, never all of 197).
                   #   3. Sprint SHAPE and MODE were PO-chosen before the autonomy directive:
                   #      "Full audit, 11 pts" and "In-process".
                   # THIS IS THE AUDIT SPRINT the PO asked to be reminded about at EVERY planning
                   # until scheduled or dropped (memory: wanted-architecture-audit-sprint). It was
                   # raised at sprint-65 planning and is SCHEDULED HERE -- the reminder obligation
                   # is discharged for this sprint.
mode: in-process   # I run implementers and reviewers myself. Chosen over `external` because audit
                   # work is judgement-heavy reading with no crisp hand-off surface, and sprint 65's
                   # external delivery self-reported "verified" while ruff was RED with 22 errors
                   # (incl. F821 undefined `httpx`), after which the PO directed the fix round
                   # in-process. Ceremony: 3-pointers get implementer -> spec-review || quality
                   # review -> DoD gate -> reality gate. STORY-196 is 2 points but gets BOTH
                   # reviewers anyway -- its duplicated-declaration sweep is the sprint's only novel
                   # mechanical claim.
goal: >-
  Find the boundary violations the eight contracts cannot see, and turn as many as possible into
  contracts that can. Deliverable is FINDINGS PLUS MECHANICAL GUARDS; every non-trivial fix is
  FILED as its own story, never done inline (PO ruling). Motivating fact: an inbound adapter
  persisting through a core port passes all eight lint-imports contracts while being
  architecturally wrong (STORY-190) -- so if one such gap exists, others are probably in the tree.
branch: sprint-66  # off sprint-65, which STAYS UNMERGED (standing "don't merge with main"
                   # directive, re-confirmed at the sprint-64 review).
