# ── Provenance ────────────────────────────────────────────────────────────────
# This sprint follows the PO's rejection of the sprint-59/60/61 operator cockpit
# ("i dont like this ui also", 2026-07-28) and the sprint-61 abort
# (docs/scrum/sprints/2026-07-22-sprint-61/aborted.md, keep-all-unmerged).
# Planning artefacts, all in docs/scrum/sprints/2026-07-28-sprint-62/:
#   ui-backend-gap-analysis.md     — the new reference UI vs the api/v1 surface; PO decisions §3a
#   config-shape-proposal.yaml     — the nested authoring shape (PO: "this shape looks good")
#   calculations-under-new-config.md — full calculation walkthrough + the two defects it surfaces
#   decisions-and-future-work.md   — D1-D4 decided, F1-F3 future work
#   program-roadmap.md             — option (a) split across sprints per PO pacing directive
#   plan.md                        — this sprint's contracts, steps, reality gates
# ── Scope discipline ──────────────────────────────────────────────────────────
# PO approved scope option (a) (~21 pts) but directed "do it multi sprint, with carefull
# verification, no need to rush in single stretch" — so it is SPLIT. This sprint is 11 pts,
# near the ~9 baseline. Frontend lands sprint 63+ (design system + shell first, with a PO
# look-and-feel checkpoint BEFORE six pages are built on the language — the pilot fix for the
# process failure behind three rejections).
# EXPLICITLY OUT: all frontend work; STORY-150 (breadth model D1/D2), STORY-151 (per-component
# decision rollup), STORY-152 (expected-locations completeness), STORY-153 (rejection
# suppression F1), STORY-154 (map real failure codes — BLOCKED on trial renewal),
# STORY-155 (sample_mode removal).
# ── Live-data caveat ──────────────────────────────────────────────────────────
# The Dynatrace trial expired 2026-07-28: no observations arrive, nothing is reality-gateable
# against real vendor data, and sample_mode (which flips already-normalized rows) is inert.
# STORY-148 exists to replace that. Its reality gate is therefore a WIRE-SHAPE comparison
# against real captured fixtures (backend/tests/fixtures/dynatrace/grail_synthetic_events.json),
# not "the loop didn't crash". Every failure-state row rests on ASSUMED vendor codes —
# map_synthetic_status maps only "0"/"HEALTHY" and raises otherwise
# (adapters/inbound/dynatrace/health_mapping.py:65-70). That limit is stated in the evidence,
# never absorbed as "the failure path is tested".
# ── Safety precondition (non-negotiable) ──────────────────────────────────────
# decide publishes RECOVERIES WITH NO HUMAN GATE (core/services/decide.py:122-126). A demo run
# wired to the real publisher would post fake statuses to the LIVE public Statuspage.
# STORY-148 AC4 makes the stub a tested guarantee; NO demo loop is started before it exists.
# ── Baseline ──────────────────────────────────────────────────────────────────
# First full-gate attempt on this branch was RED: `npm run build` exit 1. Diagnosed as
