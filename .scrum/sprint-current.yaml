plan_verification:
  contract_sensitive: true
  reason: >-
    TWO INDEPENDENT COUNTS. STORY-204 touches the vendor DQL path (adapters/inbound/dynatrace);
    STORY-205 touches the persistence key schema, which is a CONTRACT between the seed path and two
    repositories -- the audit's own citation records that contract drifting once already and costing
    two debugging runs.
  dispatched: false
  dispatched_reason: >-
    Performed BY THE ORCHESTRATOR during this planning pass, not by a dispatched yt-plan-verifier.
    Sprint 67's subagent ruling was recorded per-sprint and does not carry over on its own; the PO
    is asked to re-confirm it at approval (see ceremony_note), which would also cover dispatching a
    real verifier before lock. Recording the substitution rather than letting `dispatched: true`
    imply a subagent ran.
  findings: >-
    THE ORCHESTRATOR PASS CHANGED THE PLAN IN FOUR PLACES, recorded rather than silently folded in:
    (1) STORY-204 MUST PRECEDE STORY-203 -- 204 relocates _HEALTH_CHECK_WINDOW, whose file:line is
        cited by tools/demo_engine/store.py, which is the exact citation 203 AC4 adjudicates. The
        backlog priority order had them the other way round.
    (2) STORY-205'S SHAPE WAS UNDECIDED AND IS NOW DECIDED. Its filed note flagged the sizing risk
        ("may need a third method or a small new TopologyRepository port"). Refinement chose the
        schema-module option ZR-8's own Coverage verdict already sanctions in writing, keeping it at
        3 points. A new core-owned port for a value NO core service reads or writes would launder a
        boot script through the core.
    (3) STORY-215'S SCOPE WAS UNDERSTATED BY ITS OWN TITLE. A third CONFIG_DIR reader --
        scripts/seed_topology.py:25, `os.environ.get("CONFIG_DIR", "config/apps")`, bypassing
        load_settings() -- was found at THIS refinement and is absent from the audit's list. It is
        an independent declaration of both the NAME and the DEFAULT, in a third process, which is
        the sprint-64 incident's own shape. This is why 215 is an ENABLER for sprint 69's 209.
    (4) STORY-205 AC4'S DRIFT CITATION IS ALREADY CLEAN. tools/demo_loop_gate/
        failure_path_reality_gate.py routes through the REAL repository at HEAD and its docstring
        explains why. The audit's citation is history, not a live second site; the AC now says
        VERIFY, not FIX.
    ALSO MEASURED FOR SPRINT 69's STORY-206: raising the import-linter contract count 8 -> 9 means
    updating 15 occurrences of "eight contracts" across 6 LIVING files (CLAUDE.md,
