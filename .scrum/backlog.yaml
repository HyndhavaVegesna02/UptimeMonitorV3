                    #   exit code is honest. If it ever costs someone time, file it fresh.
                    # ---- original filing, kept for history ----
                    # ~1pt. SKILL-level defect, found 2026-07-28 running STORY-146's gate.
                    # `yt_gate.py --only pytest,lint-imports,ruff-check,ruff-format` (comma form)
                    # matched NO commands -- --only is a REPEATABLE SUBSTRING flag, not a csv --
                    # and the runner printed "no gate commands parsed (check the DoD file format)"
                    # and then EXITED 0. An orchestrator trusting the exit code records a green
                    # DoD gate for a story on which nothing ran. This is the worst failure mode
                    # available to the enforcement floor: the mechanical check that exists so
                    # prose cannot be rationalized, silently rationalizing itself.
                    # FIX (script rung, per the enforcement ladder): exit NONZERO when zero
                    # commands are selected, and distinguish "DoD file unparseable" from "--only
                    # filtered everything out" -- the current message blames the DoD file for what
                    # was actually a bad filter. Consider erroring on a comma in --only, since the
                    # csv form looks plausible and fails silently.
                    # Caught only because the evidence artifact was READ rather than the exit code
                    # trusted; the working agreement to merge yt_gate's fragment verbatim is what
                    # surfaced it.
                    # SECOND DEFECT, same script, found 2026-07-29 recording STORY-146's gate:
                    # the emitted dod_evidence fragment is NOT VALID YAML when a command's output
                    # contains ANSI escapes. `npm run build` colours its output, so output_tail
                    # carried raw ESC[32m... (an ESC byte, 0x1b), and yaml.safe_load rejected the board file with
                    # "unacceptable character #x001b". The working agreement says merge the
                    # fragment VERBATIM - which here produces a corrupt board. yt_gate must strip
                    # ANSI/C0 control characters from output_tail before emitting.
                    # REPRODUCED AGAIN 2026-07-29 at STORY-148's gate (commit 6015b12): exactly 2
                    # ESC bytes in the emitted fragment, both from `npm run build`. So it is
                    # deterministic per gate run, not a one-off - every full gate that includes a
